function tuval(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c}
const rnd=(a,b)=>a+Math.random()*(b-a);
// arnavut kaldirimi
const tasC=tuval(1024,1024,(g,w,h)=>{g.fillStyle='#4a4038';g.fillRect(0,0,w,h);const sat=26;const sh=h/sat;
 for(let r=0;r<sat;r++){let x=-rnd(0,30);const y=r*sh;while(x<w){const bw=rnd(30,52);const L=rnd(30,52),hu=rnd(22,36);

// tas duvar
const duvarC=tuval(512,512,(g,w,h)=>{g.fillStyle='#8a7a68';g.fillRect(0,0,w,h);let y=0;while(y<h){const sh=rnd(26,44);let x=-rnd(0,40);while(x<w){const bw=rnd(40,90);g.fillStyle=`hsl(${rnd(25,38)},${rnd(10,22)}%,${rnd(52,70)}%)`;
 g.beginPath();g.roundRect?g.roundRect(x+2,y+2,bw-4,sh-4,6):g.rect(x+2,y+2,bw-4,sh-4);g.fill();g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x+2,y+sh-9,bw-4,6);x+=bw}y+=sh}});

const ahsapM=new THREE.MeshStandardMaterial({color:0x5a3a22,roughness:.85});const kepenkM=[0x2f5d4a,0x3a5a7a,0x6b4426].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}));

/* ---------------- meydan ---------------- */

function ev(x,z,yaw,w,hh,d){const g=new THREE.Group();const govde=new THREE.Mesh(new THREE.BoxGeometry(w,hh,d),duvarM.clone());govde.material.map=govde.material.map.clone();govde.material.map.repeat.set(w/3.2,hh/3.2);govde.material.map.needsUpdate=true;
 govde.material.bumpMap=govde.material.map;govde.position.y=hh/2;govde.castShadow=govde.receiveShadow=true;g.add(govde);
 const sh=new THREE.Shape();sh.moveTo(-w/2-.4,0);sh.lineTo(0,w*.36);sh.lineTo(w/2+.4,0);sh.lineTo(-w/2-.4,0);const cg=new THREE.ExtrudeGeometry(sh,{depth:d+.8,bevelEnabled:false});cg.translate(0,0,-(d+.8)/2);
 const cm=catiM.clone();cm.map=catiM.map.clone();cm.map.repeat.set(w/2.5,d/2.5);cm.map.needsUpdate=true;const cati=new THREE.Mesh(cg,cm);cati.position.y=hh;cati.castShadow=true;g.add(cati);
 const kat=hh>5.5?2:1;for(let k=0;k<kat;k++)for(let i=0;i<Math.max(1,Math.floor(w/2.6));i++){const n=Math.max(1,Math.floor(w/2.6));const px=(i-(n-1)/2)*(w/n);if(k===0&&i===Math.floor(n/2))continue;
  const yan=Math.random()<.35;const p=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.25),yan?isikliCamM:camM);p.position.set(px,1.7+k*2.6,d/2+.03);g.add(p);
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.45,.04),ahsapM);c.position.set(px,1.7+k*2.6,d/2-.0);g.add(c);
  if(!yan)for(const sx of[-1,1]){const kp=new THREE.Mesh(new THREE.BoxGeometry(.5,1.4,.05),kepenkM[(i+k)%3]);kp.position.set(px+sx*.82,1.7+k*2.6,d/2+.05);g.add(kp)}}
 const kapi=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.2,.12),ahsapM);kapi.position.set(0,1.1,d/2);g.add(kapi);
 g.position.set(x,0,z);g.rotation.y=yaw;S.add(g)}
for(let i=0;i<18;i++){const a=i/18*Math.PI*2+rnd(-.05,.05),r=rnd(31,35);ev(Math.sin(a)*r,Math.cos(a)*r,a+Math.PI,rnd(6,9),rnd(4.2,7.2),rnd(5,7))}
// buyuk cinar (meydanin kenarinda)
{const g=new THREE.Group(),gm=new THREE.MeshStandardMaterial({color:0x4a3526,roughness:1}),ym=new THREE.MeshStandardMaterial({color:0x2c4219,roughness:.95});
 const gv=new THREE.Mesh(new THREE.CylinderGeometry(.55,.9,7,10),gm);gv.position.y=3.5;gv.castShadow=true;g.add(gv);
 for(let i=0;i<70;i++){const ge=new THREE.IcosahedronGeometry(rnd(.7,1.3),1),pa=ge.attributes.position;for(let k=0;k<pa.count;k++)pa.setXYZ(k,pa.getX(k)*rnd(.75,1.2),pa.getY(k)*rnd(.75,1.2),pa.getZ(k)*rnd(.75,1.2));ge.computeVertexNormals();
  const an=Math.random()*6.28,rr=Math.sqrt(Math.random())*4;const b=new THREE.Mesh(ge,ym);b.position.set(Math.cos(an)*rr,rnd(6,10.5)-rr*.35,Math.sin(an)*rr);b.castShadow=true;g.add(b)}
 g.position.set(18,0,-20);S.add(g)}
// direkler + ampul zinciri
const AMP=[];{const dm=new THREE.MeshStandardMaterial({color:0x3a2a20,roughness:.8}),N=14,RD=19;const pts=[];
 for(let i=0;i<N;i++){const a=i/N*Math.PI*2,p=new V3(Math.sin(a)*RD,4.6,Math.cos(a)*RD);pts.push(p);const d=new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,4.6,6),dm);d.position.set(p.x,2.3,p.z);d.castShadow=true;S.add(d)}
 for(let i=0;i<N;i++){const a=pts[i],b=pts[(i+1)%N];for(let k=1;k<12;k++){const f=k/12;AMP.push(new V3().lerpVectors(a,b,f).setY(4.6-Math.sin(f*Math.PI)*.7))}}
 // merkeze uzanan zincirler (yuksek direk yok: ucak gibi gerilmis tel)
 const tel=[];for(let i=0;i<AMP.length-1;i++){const a=AMP[i],c=AMP[i+1];if(a.distanceTo(c)<2.2)tel.push(a,c)}const tg=new THREE.BufferGeometry().setFromPoints(tel);S.add(new THREE.LineSegments(tg,new THREE.LineBasicMaterial({color:0x2a2018})));
 const im=new THREE.InstancedMesh(new THREE.SphereGeometry(.055,6,4),new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),AMP.length);const o=new THREE.Object3D();
 AMP.forEach((p,i)=>{o.position.copy(p);o.updateMatrix();im.setMatrixAt(i,o.matrix);im.setColorAt(i,new THREE.Color().setHSL([.09,.08,.0,.12,.33][i%5],[1,1,.9,1,.7][i%5],.62).multiplyScalar(1.6))});S.add(im)}
// ortada kirmizi hali (gelin-damat)
const HALI=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,.04,40),new THREE.MeshStandardMaterial({color:0x6e0716,roughness:1,envMapIntensity:.3}));HALI.position.y=.02;HALI.receiveShadow=true;S.add(HALI);
{const k=new THREE.Mesh(new THREE.TorusGeometry(2.4,.06,6,48),new THREE.MeshStandardMaterial({color:0xe2b04a,metalness:.6,roughness:.35}));k.rotation.x=Math.PI/2;k.position.y=.05;S.add(k)}

/* ---------------- insan modelleri ---------------- */
const MODEL=[['carla',0],['claudia',0],['sophia',0],['eric',1],['nathan',1],['manuel',1]];// [ad, erkek mi]
const SAB={};const yukle=new THREE.GLTFLoader();
const temizAd=n=>String(n).replace(/^rp_[a-z]+_(rigged|animated)_\d+(_[a-z]+)?_/,'').replace(/_\d+$/,'');
function sablon(ad){return SAB[ad]||(SAB[ad]=new Promise((ok,no)=>yukle.load(`model/insan/${ad}.glb?v=1`,gl=>{
 gl.scene.traverse(o=>{if(o.isBone)o.name=temizAd(o.name);if(o.isMesh){o.castShadow=true;o.receiveShadow=false;o.frustumCulled=false;if(o.material){o.material.envMapIntensity=.9;o.material.side=THREE.FrontSide}}});
 for(const c of gl.animations)for(const tr of c.tracks){const i=tr.name.lastIndexOf('.');tr.name=temizAd(tr.name.slice(0,i))+tr.name.slice(i)}
 ok(gl)},undefined,no)))}
const KEM=['middle_01_l','middle_01_r','root','hip','spine_01','spine_02','spine_03','neck','head','shoulder_l','upperarm_l','lowerarm_l','hand_l','shoulder_r','upperarm_r','lowerarm_r','hand_r','upperleg_l','lowerleg_l','foot_l','upperleg_r','lowerleg_r','foot_r'];

 const B={};kok.traverse(o=>{if(o.isBone&&KEM.includes(o.name)&&!B[o.name])B[o.name]=o});B.middle_l=B.middle_01_l;B.middle_r=B.middle_01_r;delete B.middle_01_l;delete B.middle_01_r;

 // olcek: bas yuksekligi ~1.62 m

  kalca:P('upperleg_l').y,omuz:P('upperarm_l').distanceTo(P('upperarm_r'))/2,ayakY:P('foot_l').y,adim:P('upperleg_l').distanceTo(P('upperleg_r'))/2};
 // dinlenme hali (her karede buna donulur) + ayagin govdeye gore dunya yonu
 const r0={};for(const k in B)r0[k]=B[k].quaternion.clone();
 const ayakQ={};for(const k of['foot_l','foot_r']){B[k].getWorldQuaternion(ayakQ[k]=new Q4())}

function hedefle(kem,cocuk,yon){kem.getWorldPosition(_a);cocuk.getWorldPosition(_b);_b.sub(_a).normalize();
 _q1.setFromUnitVectors(_b,yon);kem.getWorldQuaternion(_q2);_q2.premultiply(_q1);kem.parent.getWorldQuaternion(_q3).invert();kem.quaternion.copy(_q3.multiply(_q2));kem.updateMatrixWorld(true)}
function dunyaDon(kem,eksen,aci){_q1.setFromAxisAngle(eksen,aci);kem.getWorldQuaternion(_q2);_q2.premultiply(_q1);kem.parent.getWorldQuaternion(_q3).invert();kem.quaternion.copy(_q3.multiply(_q2));kem.updateMatrixWorld(true)}

// iki kemikli IK: b1-b2-b3 zinciri, uc 'hedef'e, dirsek/diz 'kutup' yonune
const _P1=new V3(),_D=new V3(),_PP=new V3(),_KN=new V3(),_T=new V3(),_DR=new V3();
function ik(b1,b2,b3,hedef,kutup,l1,l2){b1.getWorldPosition(_P1);_D.copy(hedef).sub(_P1);let d=_D.length();d=Math.max(Math.abs(l1-l2)+.01,Math.min((l1+l2)*.995,d));_D.normalize();

 _T.copy(_P1).addScaledVector(_D,d);b2.getWorldPosition(_a);hedefle(b2,b3,_DR.copy(_T).sub(_a).normalize())}
