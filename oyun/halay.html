<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halay Meydanı</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;color:#fff;font-family:Nunito,Segoe UI,Arial,sans-serif}#sahne{position:fixed;inset:0}
.et{position:fixed;left:0;top:0;display:flex;align-items:center;gap:.6vh;padding:.3vh 1.1vh .3vh .3vh;border-radius:3vh;background:rgba(14,10,40,.82);border:.22vh solid #fff5;font:800 1.5vh Nunito,Segoe UI,Arial;color:#fff;white-space:nowrap;pointer-events:none;z-index:12;box-shadow:0 .4vh 1.2vh rgba(0,0,0,.45)}
.et img{width:2.8vh;height:2.8vh;border-radius:50%;background:#333}.et i{font-style:normal;color:#ffc94a;margin-left:.2vh}
.et.r1{font-size:1.85vh;border-color:#ffc94a;background:linear-gradient(90deg,rgba(90,40,10,.92),rgba(150,70,10,.92))}.et.r1 img{width:3.7vh;height:3.7vh;border:.25vh solid #ffc94a}.et.r1 i{color:#ffe9a8}
.et.r2{border-color:#cfd8e6}.et.r3{border-color:#e0955a}
.pop{position:fixed;left:0;top:0;font:900 1.6vh Nunito,Segoe UI,Arial;color:#fff;text-shadow:0 0 .5vh #000,0 .15vh .3vh #000;pointer-events:none;z-index:11;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.pop.msj{background:#fff;color:#222;text-shadow:none;border-radius:1.2vh;padding:.3vh .9vh;font-weight:800;font-size:1.4vh;box-shadow:0 .3vh .8vh rgba(0,0,0,.35)}
.bant{position:fixed;left:50%;top:13.2vh;transform:translateX(-50%);z-index:21;pointer-events:none;background:rgba(10,8,30,.62);border:1px solid rgba(255,201,74,.45);border-radius:3vh;padding:.55vh 1.6vh;font:800 1.5vh Nunito,Segoe UI,Arial;color:#ffe9b0;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.bant.buyuk{font-size:2vh;background:linear-gradient(90deg,#8a2a00,#d4760a);color:#fff;border-color:#ffd166;animation:bz .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bz{from{transform:translateX(-50%) scale(.4);opacity:0}}
.bos{position:fixed;left:50%;top:44vh;transform:translate(-50%,-50%);text-align:center;font:900 2.6vh/1.35 Nunito,Segoe UI,Arial;color:#fff;text-shadow:0 .3vh 1vh #000;pointer-events:none;z-index:10;width:86vw}
.bos small{display:block;font-size:1.8vh;font-weight:700;color:#ffe2a0}
</style></head><body>
<canvas id="sahne"></canvas>
<div class="bant" id="bant"></div><div class="bos" id="bos">🔥 Halay başlamak üzere!<small>❤ Beğeni gönder ya da yorum yaz,<br>halaya ilk sen katıl!</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="core.js?v=3"></script><script src="uc.js?v=3"></script><script src="hud.js?v=3"></script>
<script>
/* HALAY MEYDANI
   - Her etkilesim "coşku" puani verir (birikimli, gecikmeye dayanikli; refleks yok).
   - Halaydaki SIRA = coşku sirasi. En onde (kirmizi mendilli) HALAYBAŞI. 3 dk sonunda halaybasi kazanir.
   - Hediyeler bu oyuna ozel: mendil salla, zilgit, mendil kap, davul, halaybasini devir, dugun havasi. */
const W=()=>innerWidth,H=()=>innerHeight,now=()=>performance.now(),V3=THREE.Vector3;
const DAR=Math.min(innerWidth,innerHeight)<700;
const HED=[['🌹','Gül','mendil salla +20'],['💖','Kalp','zılgıt: 15 sn 2x'],['💐','Parfüm','mendili kap %12'],['🍩','Donut','davul çalar +160'],['🎩','Şapka','halaybaşını devir'],['🌌','Galaksi','halaybaşı ol 👑']];
OY.hud({baslik:'HALAY MEYDANI',alt:'❤ Beğen → coşku topla · En coşkulu 2 kişi ortada GELİN ve DAMAT olur 👰🤵',renk:'#ffc94a',hediyeler:HED});
OY.demoYorum=()=>['Halaya ben de varım!','Hadi davul!','Mendil bende','Oyy oy','Kim halaybaşı?','Zılgıt çekin!','Çek halayı!','Yaşasın'][Math.random()*8|0];

// ---------------- sahne ----------------
const R=new THREE.WebGLRenderer({canvas:document.getElementById('sahne'),antialias:!DAR,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,DAR?1:1.5));R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.fog=new THREE.Fog(0x1d1850,50,120);
const K=new THREE.PerspectiveCamera(45,1,.5,300);
function boyut(){R.setSize(W(),H());K.aspect=W()/H();K.updateProjectionMatrix()}boyut();addEventListener('resize',boyut);
const gk=document.createElement('canvas');gk.width=4;gk.height=256;{const g=gk.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#060824');gr.addColorStop(.55,'#1d1a5c');gr.addColorStop(1,'#5a3270');g.fillStyle=gr;g.fillRect(0,0,4,256)}
S.background=new THREE.CanvasTexture(gk);
S.add(new THREE.HemisphereLight(0xb8c0ff,0x5a3a20,.95));
const ay=new THREE.DirectionalLight(0xe8ecff,.55);ay.position.set(-10,30,25);S.add(ay);
const ates=new THREE.PointLight(0xff8a3a,2.2,40,1.3);ates.position.set(0,3,0);S.add(ates);
const zt=document.createElement('canvas');zt.width=zt.height=256;{const g=zt.getContext('2d');g.fillStyle='#4a3b31';g.fillRect(0,0,256,256);
 for(let y=0;y<256;y+=16)for(let x=(y/16%2)*12;x<256;x+=24){g.fillStyle=`hsl(24,${14+Math.random()*10}%,${32+Math.random()*12}%)`;g.fillRect(x+1,y+1,22,14)}}
const ztx=new THREE.CanvasTexture(zt);ztx.wrapS=ztx.wrapT=THREE.RepeatWrapping;ztx.repeat.set(14,14);ztx.encoding=THREE.sRGBEncoding;
const zemin=new THREE.Mesh(new THREE.CircleGeometry(70,48),new THREE.MeshLambertMaterial({map:ztx}));zemin.rotation.x=-Math.PI/2;S.add(zemin);
// ates cukuru
const cukur=new THREE.Mesh(new THREE.TorusGeometry(1.3,.38,6,18),new THREE.MeshLambertMaterial({color:0x6a6268}));cukur.rotation.x=Math.PI/2;cukur.position.y=.25;cukur.visible=false;S.add(cukur);
const alevler=[];for(let i=0;i<9;i++){const a=new THREE.Mesh(new THREE.ConeGeometry(.3,1.2,6),new THREE.MeshBasicMaterial({color:[0xffcc33,0xff7a1a,0xff4411][i%3],transparent:true,opacity:.9}));
 a.position.set(Math.cos(i*.7)*.45,.9,Math.sin(i*.7)*.45);S.add(a);alevler.push(a)}
// cevre: evler, agaclar, banklar, fenerler, isik zinciri
const EVLER='abcdefghijklmnopqrstu'.split('');
for(let i=0;i<16;i++){const ang=i/16*Math.PI*2,r=34+(i%2)*3;UC.yerlestir(`model/sehir/building-type-${EVLER[(i*7)%EVLER.length]}.glb`,Math.cos(ang)*r,0,Math.sin(ang)*r,-ang-Math.PI/2,7,S)}
for(let i=0;i<14;i++){const ang=(i+.5)/14*Math.PI*2,r=26;UC.yerlestir(`model/sehir/tree-${i%3?'large':'small'}.glb`,Math.cos(ang)*r,0,Math.sin(ang)*r,i,7,S)}
for(let i=0;i<8;i++){const ang=i/8*Math.PI*2+.2,r=19;UC.yerlestir('model/tatil/bench.glb',Math.cos(ang)*r,0,Math.sin(ang)*r,-ang+Math.PI/2,3,S);UC.yerlestir('model/tatil/lantern.glb',Math.cos(ang+.2)*r,0,Math.sin(ang+.2)*r,0,3.2,S)}
for(let i=0;i<12;i++){const ang=i/12*Math.PI*2,r=22;UC.yerlestir('model/tatil/lights-colored.glb',Math.cos(ang)*r,6.5,Math.sin(ang)*r,-ang+Math.PI/2,12,S)}

// ---------------- dokular ----------------
function emojiTex(e,boy=64){const c=document.createElement('canvas');c.width=c.height=boy;const g=c.getContext('2d');g.font=`${boy*.8}px serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,boy/2,boy*.56);return new THREE.CanvasTexture(c)}
const TX={kalp:emojiTex('💖'),nazar:emojiTex('🧿'),gul:emojiTex('🌹'),yildiz:emojiTex('⭐'),toz:emojiTex('💨')};
const golgeTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(0,0,0,.55)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const mendilTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#e01030';g.fillRect(0,0,64,64);g.strokeStyle='#ffd34a';g.lineWidth=6;g.strokeRect(4,4,56,56);g.fillStyle='#ffd34a';for(let i=0;i<4;i++){g.beginPath();g.arc(16+i%2*32,16+(i>>1)*32,5,0,7);g.fill()}return new THREE.CanvasTexture(c)})();
const golgeGeo=new THREE.PlaneGeometry(2,2),golgeMat=new THREE.MeshBasicMaterial({map:golgeTex,transparent:true,depthWrite:false});
const mendilGeo=new THREE.PlaneGeometry(1,1,3,3),mendilMat=new THREE.MeshBasicMaterial({map:mendilTex,side:THREE.DoubleSide});
const halkaGeo=new THREE.RingGeometry(.85,1.15,28);halkaGeo.rotateX(-Math.PI/2);
const SIRA_RENK=[0xffc94a,0xdfe7f2,0xe0955a];
// halaybasi isik konisi (sahte spot, ucuz)
const koni=new THREE.Mesh(new THREE.CylinderGeometry(.6,2.1,9,20,1,true),new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,opacity:.16,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));koni.position.y=4.5;S.add(koni);

// ---------------- oyuncular ----------------
const SKALA=2.7,ARA=1.5,MAKS=24;
const U={},HALKA=[];let sira=[],lider=null,KAL={kazan:{},tur:0};
const hash=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);
function kul(e){let u=U[e.id];if(!u)u=U[e.id]={id:e.id,ad:e.ad||'?',foto:e.foto,puan:0,son:0,giris:now(),o:null,slot:-1};if(e.foto&&!u.foto)u.foto=e.foto;return u}
function karakter(u){const g=new THREE.Group(),o={g,model:null,faz:Math.random()*6,zip:0,ak:null,akBit:0};
 UC.ornek(UC.KARAKTER[hash(u.id)%UC.KARAKTER.length],SKALA).then(m=>{o.model=m;g.add(m.sahne);m.sahne.traverse(b=>{if(b.name==='arm-left')o.kolL=b;if(b.name==='arm-right')o.kolR=b;if(b.isMesh)b.castShadow=b.receiveShadow=false});ani(o,'idle')});
 o.golge=new THREE.Mesh(golgeGeo,golgeMat);o.golge.rotation.x=-Math.PI/2;o.golge.position.y=.03;o.golge.scale.setScalar(.75);g.add(o.golge);
 o.halka=new THREE.Mesh(halkaGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthWrite:false}));o.halka.position.y=.05;o.halka.visible=false;g.add(o.halka);
 o.rozet=UC.rozet(u,.62);o.rozet.position.y=2.35;g.add(o.rozet);
 S.add(g);return o}
function ani(o,ad,tek=0,hiz=1){const m=o.model;if(!m)return;const e=m.eylem[ad];if(!e)return;if(o.ak===e&&!tek)return;
 e.reset();e.timeScale=hiz;e.setLoop(tek?THREE.LoopOnce:THREE.LoopRepeat,Infinity);e.clampWhenFinished=!!tek;e.enabled=true;
 if(o.ak&&o.ak!==e)o.ak.crossFadeTo(e,.18,false);e.play();o.ak=e;o.akBit=tek?now()+e.getClip().duration*1000/hiz:0}
function katil(u){if(u.o)return true;
 if(HALKA.length>=MAKS){const eski=HALKA.filter(x=>x!==lider).reduce((a,b)=>!a||b.son<a.son?b:a,null);if(!eski||now()-eski.son<15000)return false;cik(eski)}
 u.o=karakter(u);u.slot=HALKA.length+2;HALKA.push(u);const p=elipsNokta(0);u.o.g.position.set(p.x*1.6,0,p.z*1.6);
 if(HALKA.length<=12||Math.random()<.4)OY.akis(`💃 ${u.ad} halaya katıldı`,'#aef');OY.ses.davul();document.getElementById('bos').style.display='none';return true}
function cik(u){S.remove(u.o.g);if(u.pop){u.pop.remove();u.pop=null}u.o=null;HALKA.splice(HALKA.indexOf(u),1)}

// ---------------- halay cemberi (oval, kameraya dogru uzun) ----------------
let rx=3.4,rz=5;const ELIPS=[];let ELU=1;
function elipsKur(){ELIPS.length=0;let L=0,px=0,pz=rz;for(let i=0;i<=128;i++){const a=i/128*Math.PI*2,x=rx*Math.sin(a),z=rz*Math.cos(a);if(i)L+=Math.hypot(x-px,z-pz);ELIPS.push([L,a]);px=x;pz=z}ELU=L}
function elipsNokta(s,out=new V3()){s=((s%ELU)+ELU)%ELU;let lo=0,hi=128;while(hi-lo>1){const m=(lo+hi)>>1;if(ELIPS[m][0]<s)lo=m;else hi=m}
 const A=ELIPS[lo],B=ELIPS[hi],f=(s-A[0])/Math.max(1e-6,B[0]-A[0]),a=A[1]+(B[1]-A[1])*f;out.set(rx*Math.sin(a),0,rz*Math.cos(a));out.a=a;return out}
elipsKur();

// ---------------- efektler ----------------
const parca=[];const konfGeo=new THREE.PlaneGeometry(.22,.12),konfMat=[0xff4d6d,0xffd166,0x06d6a0,0x4cc9f0,0xff9f1c].map(c=>new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));
function konfeti(p,n=40){n=Math.min(n,Math.max(0,320-parca.length));for(let i=0;i<n;i++){const m=new THREE.Mesh(konfGeo,konfMat[i%5]);m.position.copy(p);
 m.userData={v:new V3((Math.random()-.5)*.28,.18+Math.random()*.25,(Math.random()-.5)*.28),omur:100,g:.011,don:1};S.add(m);parca.push(m)}}
function sprt(tex,p,boy,v,omur=80,g=0){if(parca.length>360)return null;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.setScalar(boy);s.position.copy(p);s.userData={v,omur,o0:omur,g,sol:1};S.add(s);parca.push(s);return s}
const fisekGeo=new THREE.SphereGeometry(.16,4,3);
function fisek(n=5){for(let k=0;k<n;k++)setTimeout(()=>{const p=new V3((Math.random()-.5)*16,13+Math.random()*7,(Math.random()-.5)*12);const mt=new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(Math.random(),1,.62)});
 for(let i=0;i<50&&parca.length<400;i++){const m=new THREE.Mesh(fisekGeo,mt);m.position.copy(p);m.userData={v:new V3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(.26),omur:75,g:.003};S.add(m);parca.push(m)}OY.ses.patla()},k*380)}
// ucan nesneler (mendil kapma vb.)
const UCAN=[];
function ucur(obj,a,b,sure,yuk,bitti){obj.position.copy(a);S.add(obj);UCAN.push({obj,a:a.clone(),b,t0:now(),sure,yuk,bitti})}
function davulYap(){const g=new THREE.Group();const gv=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.7,16),new THREE.MeshLambertMaterial({color:0xb5261e}));g.add(gv);
 for(const y of[-.36,.36]){const r=new THREE.Mesh(new THREE.TorusGeometry(.56,.06,5,16),new THREE.MeshLambertMaterial({color:0xf2c14e}));r.rotation.x=Math.PI/2;r.position.y=y;g.add(r)}
 const deri=new THREE.Mesh(new THREE.CircleGeometry(.53,16),new THREE.MeshLambertMaterial({color:0xfff3dc}));deri.rotation.x=-Math.PI/2;deri.position.y=.36;g.add(deri);
 const tok=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.9,5),new THREE.MeshLambertMaterial({color:0x6b3e1e}));tok.position.set(.25,.75,0);tok.rotation.z=.6;g.add(tok);g.tok=tok;return g}

// ---------------- DOM: ilk 3 etiketi + kucuk yazilar ----------------
const ETK=[0,1,2].map(i=>{const d=document.createElement('div');d.className='et r'+(i+1);d.innerHTML='<img><b></b><i></i>';d.style.display='none';document.body.appendChild(d);return d});
const POPLAR=new Set();
function pop(u,yazi,renk='#fff',sure=1800,msj=0){if(!u.o)return;let p=u.pop;
 if(!p){if(POPLAR.size>=9&&!sira.slice(0,3).includes(u))return;p=u.pop=document.createElement('div');document.body.appendChild(p);POPLAR.add(p);p.u=u}
 p.className='pop'+(msj?' msj':'');p.textContent=yazi;p.style.color=msj?'#222':renk;p.bit=now()+sure;p.t0=now();p._w=0}
function begeniPop(u,n){const t=now();if(u.pop&&!u.pop.classList.contains('msj')&&u.bpT>t-1800){u.bpN+=n}else u.bpN=n;u.bpT=t;
 const top=sira.slice(0,3).includes(u);pop(u,(top?'':OY.kisaAd(u.ad,9)+' ')+'+'+Math.round(u.bpN)+(u.zilgit>t?' 💖x2':' ❤'),u.zilgit>t?'#ff9ad5':'#fff')}

// ---------------- bant (ust bilgi seridi) ----------------
const BANT=document.getElementById('bant');let bantBit=0,ipucuI=0,ipucuT=0;
const IPUCU=['❤ Her beğeni = +1 coşku · yorum +3 · takip +10','📈 Coşkun arttıkça halayda ÖNE geçersin','👑 En öndeki mendilli = HALAYBAŞI','🏆 3 dk sonunda halaybaşı kazanır!','🎁 Hediyeyle mendil kap, davul çal, halaybaşını devir!'];
function bant(yazi,sure=3000){BANT.textContent=yazi;BANT.className='bant buyuk';BANT.style.opacity=1;bantBit=now()+sure}

// ---------------- puan ----------------
let akt=0;// son etkinlik hizi (tempo icin)
function puanEkle(u,n){if(n<=0)return 0;if(u.zilgit>now())n*=2;u.puan+=n;u.son=now();akt+=n;if(u.o)u.o.zip=Math.min(1.4,u.o.zip+.2+n*.01);return n}
const korunur=u=>u.nazar>now();
function liderBul(haric){let b=null;for(const x of Object.values(U))if(x!==haric&&x.puan>0&&(!b||x.puan>b.puan))b=x;return b}

// ---------------- hediyeler ----------------
const DAVUL=[];let dalga=null;
function hediye(u,e){const h=OY.hediye(e),t=now(),ad=OY.kisaAd(u.ad,10);puanEkle(u,10*h.adet+h.elmas*h.adet);OY.ses.para();
 const L=liderBul(u);let et='';const P=u.o.g.position;
 switch(h.sinif){
  case 'gul':{puanEkle(u,20*h.adet);ani(u.o,'emote-yes',1,1.3);u.mendilBit=t+4000;for(let i=0;i<8;i++)sprt(TX.gul,P.clone().setY(2.4),.7,new V3((Math.random()-.5)*.08,.06+Math.random()*.05,(Math.random()-.5)*.08),70,.002);
   et='mendil salladı · +20 coşku';pop(u,`🌹 ${ad} +${20*h.adet+11*h.adet}`,'#ff8fa8',2200);break}
  case 'kalp':{u.zilgit=t+15000;dalga={k:u,t0:t};OY.ses.ton(1400,.9,'sine',.12,1.3);OY.ses.ton(1700,.9,'sine',.08,1.25,undefined,.15);
   for(let i=0;i<12;i++)sprt(TX.kalp,P.clone().setY(2+Math.random()),.8,new V3((Math.random()-.5)*.05,.05+Math.random()*.04,(Math.random()-.5)*.05),100,0);
   et='ZILGIT! 15 sn beğenilerin 2x';pop(u,'💖 Lililili! x2','#ff9ad5',2500);break}
  case 'parfum':{if(!L||L.puan<=u.puan){puanEkle(u,40);et='halaybaşı zaten sensin · +40';break}
   if(korunur(L)){et=`${OY.kisaAd(L.ad,10)} nazarlı 🧿 kapamadın!`;pop(L,'🧿 korundu!','#8fd3ff');break}
   const c=Math.round(L.puan*.12);L.puan-=c;u.puan+=c;u.son=t;et=`${OY.kisaAd(L.ad,10)}'in mendilini kaptı · ${c} coşku`;
   if(L.o){ani(L.o,'emote-no',1,1.2);pop(L,`−${c} 😱`,'#ff7070',2200);const m=new THREE.Mesh(mendilGeo,mendilMat);m.scale.setScalar(1.1);ucur(m,L.o.g.position.clone().setY(2.6),u.o.g,900,4,()=>{konfeti(u.o?u.o.g.position.clone().setY(2.5):P,25);if(u.o)ani(u.o,'jump',1,1.2)})}
   pop(u,`💐 +${c} kaptı!`,'#ffd84a',2400);OY.ses.ton(900,.25,'triangle',.18,1.6);break}
  case 'donut':{let d=DAVUL.find(x=>x.u===u);if(d)d.bit+=10000;else{const g=davulYap();g.position.set(0,1.05,1.05);u.o.g.add(g);DAVUL.push({u,g,bit:t+10000,son:0})}
   et='DAVUL çalıyor · 10 sn her vuruş +8';break}
