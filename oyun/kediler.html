<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sokak Kedileri</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#b9a58c;color:#fff;font-family:Segoe UI,Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body>
<canvas id="a"></canvas><canvas id="c"></canvas>
<script src="core.js?v=4"></script><script src="hud.js?v=8"></script>
<script>
/* SOKAK KEDILERI - her izleyicinin sokakta kendi kapi onu (izgara hucresi, ust uste binme yok) ve mama kabi var.
   Begeni/yorum mama kabini doldurur. Kediler kaptan yer, kap azalir. KABI BOS KALANIN kedileri EN DOLU KABA kacar.
   Sahipsiz kediler de en dolu kaba gider. Tur sonunda en cok kedisi olan kazanir. Her sey birikimli: zamanlama gerekmez. */
const TUR=+(OY.Q.get('tur')||180),MAXS=20,KAP=100;
const HED=[['🌹','Gül','Balık: kap dolar +2 kedi'],['💖','Kalp','Kedi Evi: 25 sn kaçmaz'],['💐','Parfüm','Kedi Otu: liderden 4'],['🍩','Donut','Köpek: lideri dağıt'],['🎩','Şapka','Ciğerci: 15 sn mıknatıs'],['🌌','Galaksi','Sultan: herkesten yarı']];
OY.hud({baslik:'SOKAK KEDİLERİ',alt:'Beğen = mama · Kabı boşalanın kedisi EN DOLU kaba kaçar 🐈',renk:'#ff9f43',hediyeler:HED});
const A=document.getElementById('a'),C=document.getElementById('c'),g=C.getContext('2d');let W,H,DPR,UST,ALT,KOL=2,SAT=1,CW,CH,CS;
const now=()=>performance.now(),FONT='Nunito,Segoe UI,Arial';
const U={},SLOT=[],KEDI=[],BAL=[],OLAY=[];let turBit=now()+TUR*1000,arada=0,sonDog=0,KAL={gal:{}},LID=null,n=0;
const RENK=[['#f4a261','#c4622d'],['#3d3d3d','#161616'],['#f7f7f7','#cfcfcf'],['#c9b79c','#8d7b62'],['#f6d7a7','#d9a066'],['#8d99ae','#55627a']];
// ---------- yerlesim ----------
function olc(){const ilk=document.getElementById('hIlk'),hed=document.querySelector('.h-hed');
 UST=Math.max(H*.125,(ilk&&ilk.children.length?ilk.getBoundingClientRect().bottom:H*.12)+H*.01);
 ALT=Math.max(UST+150,(hed?hed.getBoundingClientRect().top:H*.86)-H*.118)}
function izgara(){olc();const k=Math.max(1,SLOT.filter(Boolean).length);KOL=k<=4?2:k<=9?3:4;SAT=Math.max(2,Math.ceil(k/KOL));if(KOL===4&&SAT<4)SAT=4;
 CW=W*.96/KOL;CH=(ALT-UST)/SAT;const cs0=CS;CS=Math.min(CW*.17,CH*.2);arkaCiz();if(cs0!==CS||!SPR.length)spriteKur();for(const u of Object.values(U))u.kart=null}
function hucre(u){const dolu=[];for(let i=0;i<SLOT.length;i++)if(SLOT[i])dolu.push(i);const k=Math.max(0,dolu.indexOf(u.s));return{x:W*.02+(k%KOL)*CW,y:UST+(k/KOL|0)*CH}}
function boyut(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;for(const c of[A,C]){c.width=W*DPR;c.height=H*DPR}g.setTransform(DPR,0,0,DPR,0,0);izgara()}
// ---------- statik arka plan: cumbali evler + arnavut kaldirimi ----------
function arkaCiz(){const a=A.getContext('2d');a.setTransform(DPR,0,0,DPR,0,0);let r=7;const rnd=()=>(r=r*16807%2147483647)/2147483647;
 const ust=UST*.98;a.fillStyle='#8ecae6';a.fillRect(0,0,W,ust);const ev=['#e76f51','#f4a261','#e9c46a','#2a9d8f','#8ab17d','#d4a5a5','#a8dadc'];let x=0,i=0;
 while(x<W){const w=W*(.2+rnd()*.12),h=ust*(.55+rnd()*.3);a.fillStyle=ev[i++%ev.length];a.fillRect(x,ust-h,w,h);a.fillStyle='rgba(0,0,0,.18)';a.fillRect(x,ust-h,w,4);
  a.fillStyle='#fff8e7';for(let j=0;j<Math.floor(w/(W*.07));j++)a.fillRect(x+W*.02+j*W*.07,ust-h+h*.2,W*.04,h*.22);a.fillStyle='#7a4b2a';a.fillRect(x+w*.4,ust-h*.35,w*.2,h*.35);x+=w}
 a.fillStyle='#b9a58c';a.fillRect(0,ust,W,H-ust);const s=W*.06;
 for(let y=ust;y<H;y+=s*.6)for(let xx=((y-ust)/(s*.6)%2)*s*.5-s;xx<W;xx+=s){a.fillStyle=`hsl(30,${12+rnd()*10}%,${52+rnd()*12}%)`;a.beginPath();a.ellipse(xx+s/2,y+s*.3,s*.44,s*.25,0,0,7);a.fill()}}
// ---------- kedi sprite'lari (oturan + 2 yuruyus karesi, iki yon) onceden cizilir ----------
let SPR=[];
function kediSprite(r,poz,ters){const s=CS,w=Math.ceil(s*2.4),c=document.createElement('canvas');c.width=c.height=w*DPR;const a=c.getContext('2d');a.scale(DPR,DPR);a.translate(w/2,w/2);if(ters)a.scale(-1,1);
 a.fillStyle='rgba(0,0,0,.18)';a.beginPath();a.ellipse(0,s*.62,s*.75,s*.15,0,0,7);a.fill();a.lineCap='round';
 if(poz===0){// oturan
  a.strokeStyle=r[1];a.lineWidth=s*.17;a.beginPath();a.moveTo(-s*.35,s*.5);a.quadraticCurveTo(-s*.95,s*.45,-s*.8,-s*.05);a.stroke();
  a.fillStyle=r[0];a.beginPath();a.ellipse(0,s*.18,s*.45,s*.48,0,0,7);a.fill();a.beginPath();a.arc(s*.05,-s*.42,s*.36,0,7);a.fill();
  a.beginPath();a.moveTo(-s*.28,-s*.6);a.lineTo(-s*.24,-s*.95);a.lineTo(-s*.02,-s*.72);a.moveTo(s*.12,-s*.72);a.lineTo(s*.34,-s*.95);a.lineTo(s*.38,-s*.6);a.fill();
  a.fillStyle='#222';a.beginPath();a.ellipse(-s*.08,-s*.45,s*.05,s*.09,0,0,7);a.ellipse(s*.18,-s*.45,s*.05,s*.09,0,0,7);a.fill();a.fillStyle='#ff8fa3';a.beginPath();a.arc(s*.05,-s*.33,s*.05,0,7);a.fill();
  a.fillStyle=r[1];a.fillRect(-s*.25,s*.55,s*.16,s*.1);a.fillRect(s*.1,s*.55,s*.16,s*.1)}
 else{const b=poz===1?s*.16:-s*.16;
  a.strokeStyle=r[1];a.lineWidth=s*.17;a.beginPath();a.moveTo(-s*.6,0);a.quadraticCurveTo(-s*1.05,-s*.3,-s*.85,-s*.8);a.stroke();
  a.lineWidth=s*.15;[[-s*.4,b],[-s*.15,-b],[s*.25,-b],[s*.48,b]].forEach(([x,o])=>{a.beginPath();a.moveTo(x,s*.15);a.lineTo(x+o,s*.55);a.stroke()});
  a.fillStyle=r[0];a.beginPath();a.ellipse(0,0,s*.72,s*.36,0,0,7);a.fill();a.beginPath();a.arc(s*.68,-s*.3,s*.34,0,7);a.fill();
  a.beginPath();a.moveTo(s*.45,-s*.5);a.lineTo(s*.52,-s*.85);a.lineTo(s*.68,-s*.6);a.moveTo(s*.76,-s*.6);a.lineTo(s*.93,-s*.85);a.lineTo(s*.96,-s*.48);a.fill();
  a.fillStyle='#222';a.beginPath();a.ellipse(s*.6,-s*.34,s*.05,s*.1,0,0,7);a.ellipse(s*.82,-s*.34,s*.05,s*.1,0,0,7);a.fill()}
 return{c,w}}
function spriteKur(){SPR=RENK.map(r=>[0,1,2].map(p=>[kediSprite(r,p,0),kediSprite(r,p,1)]))}
// avatar + isim plakasi onbellek
function kart(u){const f=OY.foto(u,96);if(u.kart&&u.kart.surum===f.surum)return u.kart;const ar=Math.min(CW*.17,CH*.19),fs=Math.max(10,Math.min(CW*.12,CH*.13)),w=Math.ceil(CW*.94),h=Math.ceil(ar*2+fs*1.5+4);
 const c=document.createElement('canvas');c.width=w*DPR;c.height=h*DPR;const a=c.getContext('2d');a.scale(DPR,DPR);const ax=Math.max(ar+4,w*.28);a.fillStyle='#fff';a.beginPath();a.arc(ax,ar,ar,0,7);a.fill();a.drawImage(f,ax-ar+2,2,ar*2-4,ar*2-4);
 a.font=`800 ${fs}px ${FONT}`;let s=OY.kisaAd(u.ad,12);while(s.length>2&&a.measureText(s).width>w-10)s=s.slice(0,-2)+'…';const tw=a.measureText(s).width+10,th=fs*1.35,ty=ar*2-fs*.25;
 a.fillStyle='rgba(40,20,5,.82)';a.beginPath();a.roundRect?a.roundRect(w/2-tw/2,ty,tw,th,th/2):a.rect(w/2-tw/2,ty,tw,th);a.fill();a.fillStyle='#fff';a.textAlign='center';a.textBaseline='middle';a.fillText(s,w/2,ty+th/2+1);
 u.kart={c,w,h,ar,surum:f.surum};return u.kart}
// ---------- oyuncular ----------
function kul(e){let u=U[e.id];if(!u)u=U[e.id]={id:e.id,ad:e.ad||'?',foto:e.foto,mama:0,kedi:0,son:now(),s:-1,ev:0,cig:0,cigSon:0};
 if(e.foto&&!u.foto)u.foto=e.foto;u.son=now();if(u.s<0)yerVer(u);return u}
function yerVer(u){let s=SLOT.findIndex(v=>!v);if(s<0&&SLOT.length<MAXS)s=SLOT.length;
 if(s<0){let en=null;for(const v of SLOT)if(v&&now()-v.son>30000&&(!en||v.son<en.son))en=v;if(!en)return;s=en.s;en.s=-1;SLOT[s]=null;for(const k of KEDI)if(k.u===en)k.u=null}
 SLOT[s]=u;u.s=s;u.mama=Math.max(u.mama,30);const k=SLOT.filter(Boolean).length,kol=k<=4?2:k<=9?3:4;if(kol!==KOL||Math.ceil(k/kol)>SAT)izgara()}
const oyuncular=()=>SLOT.filter(Boolean);
function besle(u,m){if(u.s>=0)u.mama=Math.min(KAP,u.mama+m)}
function enDolu(haric){let b=null;for(const u of SLOT)if(u&&u!==haric&&u.mama>8&&(!b||u.mama>b.mama))b=u;return b}
function lider(){let l=null;for(const u of SLOT)if(u&&u.kedi>0&&(!l||u.kedi>l.kedi))l=u;return l}
// ---------- kediler ----------
function kediYap(x,y,u){if(KEDI.length>=70)return null;const k={x:x??(Math.random()<.5?-20:W+20),y:y??UST+Math.random()*(ALT-UST),u:u||null,r:Math.random()*RENK.length|0,faz:Math.random()*6,yon:0,yuru:0,kalp:0,dolas:Math.random()*6};KEDI.push(k);return k}
function kediAl(k,u){if(k.u===u)return;k.u=u;k.kalp=now()+1200}
function sal(k){k.u=null;k.kac=now()+2500;k.kx=W*.05+Math.random()*W*.9;k.ky=UST+Math.random()*(ALT-UST)}
function kacir(u,adet,hedef){const ks=KEDI.filter(k=>k.u===u).sort(()=>Math.random()-.5).slice(0,adet);for(const k of ks)hedef?kediAl(k,hedef):sal(k);return ks.length}
const korunur=u=>u.ev>now();
// ---------- hediyeler: Kedilere ozel 6 etki ----------
function hediye(u,h){const t=now(),l=lider(),rakip=l&&l!==u?l:oyuncular().filter(v=>v!==u).sort((a,b)=>b.kedi-a.kedi)[0];let ik,ad,et;
 switch(h.sinif){
  case 'gul':{ik='🐟';ad='Balık';u.mama=KAP;const c=hucre(u);for(let i=0;i<2;i++)kediYap(Math.random()<.5?-20:W+20,c.y+CH/2,u);et='kap balıkla doldu · 2 yeni kedi';break}
  case 'kalp':ik='🏠';ad='Kedi Evi';u.ev=t+25000;besle(u,50);et='25 sn kedilerin kaçmaz, çalınmaz';break;
  case 'parfum':ik='🌿';ad='Kedi Otu';if(!rakip){et='kedi otu kokuyor';break}if(korunur(rakip)){et=`${OY.kisaAd(rakip.ad,10)} Kedi Evi'nde!`;break}
   et=`${OY.kisaAd(rakip.ad,10)}'den ${kacir(rakip,4,u)} kedi kaptı`;OLAY.push({tip:'ikon',u:rakip,ikon:'🌿',t});break;
  case 'donut':ik='🐕';ad='Köpek';if(!rakip){et='köpek havladı';break}if(korunur(rakip)){et=`${OY.kisaAd(rakip.ad,10)} Kedi Evi'nde!`;break}
   {const k=Math.ceil(rakip.kedi*.6);rakip.mama=0;kacir(rakip,k);OLAY.push({tip:'kopek',u:rakip,t});et=`${OY.kisaAd(rakip.ad,10)}'in ${k} kedisi kaçtı!`;OY.ses.korna()}break;
  case 'sapka':ik='🍢';ad='Ciğerci';u.cig=t+15000;u.mama=KAP;et='15 sn ciğer kokusu · kediler sana akın';break;
  case 'galaksi':{ik='👑';ad='Kedi Sultanı';let s=0;for(const v of oyuncular())if(v!==u&&!korunur(v))s+=kacir(v,Math.ceil(v.kedi/2),u);for(let i=0;i<6;i++)kediYap(Math.random()*W,UST-10,u);u.mama=KAP;OY.ses.patla();
   et=`herkesten yarısı: ${s} kedi + 6 yavru`;break}
 }
 OY.vitrin(u,ik,ad,et);OY.akis(`${h.ikon} ${u.ad} → ${ik} ${ad}`,'#ffd84a')}
OY.basla({muzik:'sakin',olay:e=>{
 if(e.t==='kalici'&&e.veri&&e.veri.gal){KAL=e.veri;return}
 if(!e.id||arada)return;const u=kul(e);if(u.s<0)return;
 if(e.t==='begeni')besle(u,(e.adet||1)*3);
 else if(e.t==='yorum'){besle(u,10);for(let i=BAL.length-1;i>=0;i--)if(BAL[i].u===u)BAL.splice(i,1);BAL.push({u,m:OY.kisaAd(String(e.metin||''),20),t:now()});if(BAL.length>3)BAL.shift()}
 else if(e.t==='takip'){besle(u,30);OY.akis(`➕ ${u.ad} takip etti · +30 mama`,'#ffe9c7')}
 else if(e.t==='paylasim'){besle(u,20);OY.akis(`🔗 ${u.ad} paylaştı · +20 mama`,'#ffe9c7')}
 else if(e.t==='hediye'){const h=OY.hediye(e);besle(u,30*h.seviye*h.adet);OY.ses.para();hediye(u,h)}
}});
OY.demoYorum=()=>['Pisi pisi','Miyav','Ne tatlılar','Kediler bende!','Mama geldi','Kedimi geri ver 😾'][Math.random()*6|0];
addEventListener('resize',boyut);boyut();for(let i=0;i<8;i++)kediYap();
// ---------- tur ----------
function turBitir(){const s=oyuncular().sort((a,b)=>b.kedi-a.kedi);arada=now()+8000;OY.ses.zafer();
 if(s[0]&&s[0].kedi>0){KAL.gal[s[0].ad]=(KAL.gal[s[0].ad]||0)+1;OY.kaydet(KAL);
  OY.kazanan(s[0],'🐈 SOKAĞIN KEDİ ANNESİ',`${s[0].kedi} kedi · ${KAL.gal[s[0].ad]}. galibiyeti`+(s[1]?`<br>🥈 ${s[1].ad} ${s[1].kedi}`+(s[2]?` · 🥉 ${s[2].ad} ${s[2].kedi}`:''):''))}}
function turBasla(){arada=0;turBit=now()+TUR*1000;OY.kazanan(null);for(const k of KEDI)sal(k);for(const u of Object.values(U))u.mama=30;OY.akis('🔔 Yeni tur! Kediler sokağa dağıldı','#ffe9c7')}
// kedinin hucre icindeki oturma yeri (ilk 6 gorunur, gerisi "+N" ile sayilir)
const YER=[[-.3,.7],[.3,.7],[-.14,.88],[.14,.88],[-.38,.88],[.38,.88]];
let son=now();
function kare(){requestAnimationFrame(kare);const t=now(),dt=Math.min(.05,(t-son)/1000);son=t;n++;
 if(arada){if(t>arada)turBasla()}else if(t>turBit)turBitir();
 const oy=oyuncular();
 if(!arada&&t-sonDog>2200&&KEDI.length<Math.min(60,6+oy.length*2.5)){sonDog=t;kediYap()}
 // sayim + mama tuketimi + ciğerci miknatisi
 for(const u of oy){u.kedi=0;u.sira=0}for(const k of KEDI){if(k.u&&k.u.s<0)k.u=null;if(k.u)k.u.kedi++}
 for(const u of oy){if(!arada)u.mama=Math.max(0,u.mama-u.kedi*.35*dt);
  if(u.cig>t&&t-u.cigSon>1500){u.cigSon=t;const r=oy.filter(v=>v!==u&&v.kedi>0&&!korunur(v));if(r.length)kacir(r[Math.random()*r.length|0],1,u)}}
 LID=lider();const dolu=enDolu(),cig=oy.find(u=>u.cig>t);
 if(!arada)for(const k of KEDI){const u=k.u;
  if(u&&u.mama<=0&&!korunur(u)&&Math.random()<.35*dt){const y=enDolu(u);if(y)kediAl(k,y);else sal(k)}
  if(!k.u&&!(k.kac>t)){const y=cig||dolu;if(y)kediAl(k,y)}}
 g.clearRect(0,0,W,H);
 g.textAlign='center';g.textBaseline='middle';
 // hucreler (kapi onu): zemin, avatar, mama kabi, kedi sayaci
 for(const u of oy){const c=hucre(u),x=c.x,y=c.y,mx=x+CW/2;u.hx=mx;u.hy=y;
  g.fillStyle=u===LID?'rgba(255,216,74,.3)':'rgba(70,40,20,.22)';g.strokeStyle=u===LID?'#ffd84a':'rgba(255,255,255,.35)';g.lineWidth=u===LID?3:1.5;
  g.beginPath();g.roundRect?g.roundRect(x+3,y+3,CW-6,CH-6,10):g.rect(x+3,y+3,CW-6,CH-6);g.fill();g.stroke();
  const k=kart(u);g.drawImage(k.c,mx-k.w/2,y+CH*.05,k.w,k.h);
  const bw=CW*.3,bh=Math.max(6,CH*.09),by=y+CH*.72,f=u.mama/KAP;g.fillStyle='#5c2e1a';g.beginPath();g.ellipse(mx,by,bw/2,bh*.6,0,0,7);g.fill();
  if(f>0){g.fillStyle=f>.15?'#d9a05a':'#ff7a5d';g.beginPath();g.ellipse(mx,by-bh*.1,bw/2*(.35+.55*f),bh*.42*(.35+.55*f),0,0,7);g.fill()}
  const cy2=by+bh*.75,ch2=Math.max(3,CH*.03);g.fillStyle='rgba(0,0,0,.45)';g.fillRect(mx-bw/2,cy2,bw,ch2);g.fillStyle=f>.15?'#7dff8a':'#ff5d5d';g.fillRect(mx-bw/2,cy2,bw*f,ch2);
  const fs=Math.max(10,Math.min(CW*.13,CH*.15));g.font=`900 ${fs}px ${FONT}`;const tx=(u===LID?'👑':'')+u.kedi+' 🐈',tw=g.measureText(tx).width+10;
  g.fillStyle=u===LID?'#ffd84a':'rgba(255,255,255,.92)';g.beginPath();g.roundRect?g.roundRect(x+CW-tw-6,y+6,tw,fs*1.3,fs*.65):g.rect(x+CW-tw-6,y+6,tw,fs*1.3);g.fill();
  g.fillStyle='#3a1d0a';g.fillText(tx,x+CW-6-tw/2,y+6+fs*.68);
  if(f<=0&&u.kedi>0){g.font=`900 ${fs*.7}px ${FONT}`;g.fillStyle='#ff3b3b';g.fillText('KAP BOŞ',mx,by-bh*1.1)}
  if(u.ev>t){g.font=`${fs}px Segoe UI Emoji,Segoe UI`;g.fillText('🏠',x+fs*.85,y+CH-fs*.8)}
  if(u.cig>t){g.font=`${fs}px Segoe UI Emoji,Segoe UI`;g.fillText('🍢',x+CW-fs*.85,y+CH-fs*.8)}}
 // kediler: hedef = sahibinin hucresindeki yer; sahipsiz = sokakta dolasir
 for(const k of KEDI){let hx,hy;const u=k.u;
  if(u&&u.hx!==undefined){const i=u.sira++;k.sira=i;const p=YER[Math.min(i,5)];hx=u.hx+p[0]*CW;hy=u.hy+p[1]*CH}
  else if(k.kac>t){hx=k.kx;hy=k.ky}
  else{hx=W/2+Math.sin(t/5000+k.dolas)*W*.42;hy=(UST+ALT)/2+Math.cos(t/6000+k.dolas*1.3)*(ALT-UST)*.42}
  const dx=hx-k.x,dy=hy-k.y,d=Math.hypot(dx,dy),sp=Math.min(d,(k.kac>t?W*.7:W*.3)*dt);
  if(d>1.5){k.x+=dx/d*sp;k.y+=dy/d*sp;k.yuru=1;if(Math.abs(dx)>2)k.yon=dx<0?1:0}else k.yuru=0}
 const sir=KEDI.filter(k=>k.yuru||!k.u||k.sira<6).sort((a,b)=>a.y-b.y);
 for(const k of sir){const p=k.yuru?(((t/140+k.faz)|0)%2)+1:0,s=SPR[k.r][p][k.yon];g.drawImage(s.c,k.x-s.w/2,k.y-s.w/2-CS*.2,s.w,s.w);
  if(k.kalp>t){g.font=`${CS*.7}px Segoe UI Emoji,Segoe UI`;g.fillStyle='#ff5d8f';g.fillText('❤',k.x,k.y-CS*1.1-(1-(k.kalp-t)/1200)*CS)}}
 g.font=`800 ${Math.max(10,CS*.6)}px ${FONT}`;for(const u of oy)if(u.kedi>6){g.fillStyle='rgba(40,20,5,.85)';const tx=`+${u.kedi-6}`,w=g.measureText(tx).width+8,yy=u.hy+CH*.79;g.fillRect(u.hx-w/2,yy-CS*.35,w,CS*.7);g.fillStyle='#fff';g.fillText(tx,u.hx,yy)}
