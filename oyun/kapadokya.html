<script>

OY.hud({baslik:'BALON FESTİVALİ',alt:'Kapadokya · Beğen → brülörü yak, en yükseğe çık 🎈',renk:'#ffb347',

  ['🍩','Donut','🦅 Kartal lideri gagalar'],['🎩','Şapka','🌀 Termal akım · 12 sn 2x'],['🌌','Galaksi','🌪️ Rüzgâr · herkes alçalır, sen +25 m']]});
OY.demoYorum=()=>['Yak brülörü! 🔥','Kartal geliyor 🦅','Bulutlara çıkıyoruz','Kum torbası atın','Ne manzara!','Hadi hadi!','Rüzgâr esti 🌪️','Zirve bizim'][Math.random()*8|0];
/* ---- render ---- */
const R=new THREE.WebGLRenderer({canvas:document.getElementById('sahne'),antialias:true,powerPreference:'high-performance'});R.outputEncoding=THREE.sRGBEncoding;
let PR=Math.max(1,Math.min(devicePixelRatio||1,2));
const S=new THREE.Scene();const VFOV=48,PITCH=.16,BANT=.48,KAY=.14;
const K=new THREE.PerspectiveCamera(VFOV,1,.5,1200),KF=new THREE.PerspectiveCamera(VFOV,1,.5,1200);
function boyut(){R.setPixelRatio(PR);R.setSize(W(),H());for(const c of[K,KF]){c.aspect=W()/H();c.updateProjectionMatrix()}K.setViewOffset(W(),H(),0,-KAY*H()/2,W(),H())}
boyut();addEventListener('resize',boyut);
const gc=document.createElement('canvas');gc.width=8;gc.height=512;{const g=gc.getContext('2d'),gr=g.createLinearGradient(0,0,0,512);
 gr.addColorStop(0,'#3d5a9e');gr.addColorStop(.45,'#9fb7e0');gr.addColorStop(.72,'#ffc996');gr.addColorStop(1,'#ff9a6b');g.fillStyle=gr;g.fillRect(0,0,8,512)}
const gtx=new THREE.CanvasTexture(gc);gtx.encoding=THREE.sRGBEncoding;S.background=gtx;S.fog=new THREE.Fog(0xffc09a,160,700);
S.add(new THREE.HemisphereLight(0xfff0e0,0xb07a50,.85));const gunes=new THREE.DirectionalLight(0xffd2a0,1);gunes.position.set(-80,60,-120);S.add(gunes);
const gm=new THREE.Mesh(new THREE.SphereGeometry(22,20,16),new THREE.MeshBasicMaterial({color:0xfff1c4,fog:false}));gm.position.set(-160,60,-560);S.add(gm);
// arazi + peri bacalari (instanced: az cizim cagrisi)
const ar=new THREE.PlaneGeometry(1400,1400,60,60);ar.rotateX(-Math.PI/2);const pos=ar.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,Math.sin(x*.012)*6+Math.cos(z*.017)*5+Math.sin((x+z)*.03)*2-4)}ar.computeVertexNormals();
S.add(new THREE.Mesh(ar,new THREE.MeshLambertMaterial({color:0xd9a06b})));
{const N=150,gov=new THREE.InstancedMesh(new THREE.CylinderGeometry(.55,1,1,7),new THREE.MeshLambertMaterial({color:0xe8bf8f}),N),
 bas=new THREE.InstancedMesh(new THREE.ConeGeometry(.9,1.4,7),new THREE.MeshLambertMaterial({color:0x7a5236}),N),m=new THREE.Matrix4(),q=new THREE.Quaternion();let n=0;
 while(n<N){const x=(Math.random()-.5)*800,z=-50-Math.random()*520;if(Math.abs(x)<45&&z>-90)continue;const h=12+Math.random()*30,r=3+Math.random()*4;
  m.compose(new THREE.Vector3(x,h/2-4,z),q,new THREE.Vector3(r,h,r));gov.setMatrixAt(n,m);m.compose(new THREE.Vector3(x,h-4+r*.6,z),q,new THREE.Vector3(r,r,r));bas.setMatrixAt(n,m);n++}

for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.CylinderGeometry(40+Math.random()*30,60+Math.random()*30,25+Math.random()*40,8),new THREE.MeshLambertMaterial({color:0xc98f5e}));m.position.set((Math.random()-.5)*1000,8,-420-Math.random()*200);S.add(m)}
/* ---- balon modeli ---- */
const zarfG=new THREE.SphereGeometry(4,20,14),etekG=new THREE.CylinderGeometry(1.6,1.1,1.6,14,1,true),sepetG=new THREE.BoxGeometry(1.6,1.2,1.6),sepetM=new THREE.MeshLambertMaterial({color:0x8b5a2b}),ipM=new THREE.LineBasicMaterial({color:0x332211});
function seritDoku(renk){const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d');const r2=renk.clone().offsetHSL(.08,0,.12),r3=renk.clone().offsetHSL(-.05,0,-.12);
 for(let i=0;i<12;i++){g.fillStyle='#'+(i%3===0?r2:i%3===1?renk:r3).getHexString();g.fillRect(i*128/12,0,128/12+1,64)}g.fillStyle='rgba(255,255,255,.85)';g.fillRect(0,30,128,4);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function balonMesh(renk,olcek=1){const g=new THREE.Group();
 const zarf=new THREE.Mesh(zarfG,new THREE.MeshLambertMaterial({map:seritDoku(renk)}));zarf.scale.set(1,1.22,1);zarf.position.y=8;g.add(zarf);
 const etek=new THREE.Mesh(etekG,new THREE.MeshLambertMaterial({color:renk,side:THREE.DoubleSide}));etek.position.y=3.6;g.add(etek);
 const sepet=new THREE.Mesh(sepetG,sepetM);sepet.position.y=1.2;g.add(sepet);
 const ip=new THREE.BufferGeometry().setFromPoints([[-.7,-.7],[.7,-.7],[-.7,.7],[.7,.7]].flatMap(([x,z])=>[new THREE.Vector3(x,1.8,z),new THREE.Vector3(x*1.6,3,z*1.6)]));g.add(new THREE.LineSegments(ip,ipM));
 g.userData={zarf};g.scale.setScalar(olcek);return g}
const DEKOR=[];for(let i=0;i<8;i++){const b=balonMesh(new THREE.Color().setHSL(Math.random(),.75,.55),.6);b.position.set((Math.random()-.5)*500,30+Math.random()*120,-240-Math.random()*250);S.add(b);DEKOR.push(b)}
// efekt parcalari (paylasilan geometri/malzeme)
const alevG=new THREE.ConeGeometry(.5,1.8,8),alevM=new THREE.MeshBasicMaterial({color:0xffa53a,transparent:true,opacity:.92});
const kalkanG=new THREE.TorusGeometry(5.8,.22,6,40),kalkanM=new THREE.MeshBasicMaterial({color:0x7fe8ff,transparent:true,opacity:.75,depthWrite:false});
const kumG=new THREE.CylinderGeometry(.42,.5,.9,8),kumM=new THREE.MeshLambertMaterial({color:0xb08a5a});
const termTx=(()=>{const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');for(let i=0;i<8;i++){g.fillStyle=i%2?'rgba(255,215,90,.0)':'rgba(255,215,90,.75)';g.save();g.translate(0,i*16);g.transform(1,.5,0,1,0,0);g.fillRect(0,-32,64,16);g.restore()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,2);return t})();
const termG=new THREE.CylinderGeometry(3.8,1.6,26,18,1,true);
/* ---- oyuncular ---- */
const U={},BAL=[];let bitis=0,ruzgar=0;
function kul(e){let u=U[e.id];if(!u)u=U[e.id]={id:e.id,ad:e.ad||'?',foto:e.foto,irt:0,hiz:0,brulor:0,alevT:0,agir:0,kartal:0,termal:0,savrul:0,puan:0,son:0,o:null,msj:'',msjT:0};if(e.foto&&!u.foto)u.foto=e.foto;return u}
let slot=0;
function katil(u){if(u.o)return true;if(BAL.length>=12){const e=BAL.reduce((a,b)=>a.son<b.son?a:b);if(now()-e.son<25000)return false;S.remove(e.o);e.o=null;BAL.splice(BAL.indexOf(e),1);if(ET[e.id]){ET[e.id].el.remove();delete ET[e.id]}}
 const i=slot++;u.o=balonMesh(new THREE.Color().setHSL((i*.137+.03)%1,.8,.55));
 const k=i%4,sr=(i/4|0)%3;u.x=(k-1.5)*10.5+(sr-1)*3.5;u.z=-sr*9;u.o.position.set(u.x,0,u.z);u.irt=Math.max(0,ortI()*.5);
 const o=u.o,ud=o.userData;
 ud.alev=new THREE.Mesh(alevG,alevM);ud.alev.position.y=3.1;ud.alev.visible=false;o.add(ud.alev);
 ud.kalkan=new THREE.Group();for(let j=0;j<2;j++){const r=new THREE.Mesh(kalkanG,kalkanM);r.rotation.x=Math.PI/2+(j?.5:-.5);ud.kalkan.add(r)}ud.kalkan.position.y=8;ud.kalkan.visible=false;o.add(ud.kalkan);
 ud.kum=new THREE.Group();for(let j=0;j<3;j++){const s=new THREE.Mesh(kumG,kumM);s.position.set((j-1)*.9,-.2-(j%2)*.5,.9);ud.kum.add(s)}ud.kum.visible=false;o.add(ud.kum);
 ud.term=new THREE.Mesh(termG,new THREE.MeshBasicMaterial({map:termTx,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));ud.term.position.y=-12;ud.term.visible=false;o.add(ud.term);
 u.son=now();S.add(o);BAL.push(u);OY.akis(`🎈 ${u.ad} balonuyla havalandı`,'#ffe2b8');return true}
const ortI=()=>BAL.length?BAL.reduce((a,b)=>a+b.irt,0)/BAL.length:0;
const korunuyor=u=>OY.korunuyor(u);
function yak(u,n){u.son=now();if(OY.donuk(u))return;u.hiz=Math.min(20,u.hiz+n);u.alevT=Math.max(u.alevT,now()+400+n*60)}
/* ---- kartal ---- */
const KARTAL=[];
function kartalMesh(){const g=new THREE.Group(),km=new THREE.MeshLambertMaterial({color:0x5a3a1e}),bm=new THREE.MeshLambertMaterial({color:0xffffff}),sm=new THREE.MeshLambertMaterial({color:0xffc21a});
 const gv=new THREE.Mesh(new THREE.SphereGeometry(.9,10,8),km);gv.scale.set(1,.8,2);g.add(gv);
 const bs=new THREE.Mesh(new THREE.SphereGeometry(.55,10,8),bm);bs.position.set(0,.35,-1.9);g.add(bs);
 const ga=new THREE.Mesh(new THREE.ConeGeometry(.22,.6,6),sm);ga.rotation.x=-Math.PI/2;ga.position.set(0,.25,-2.6);g.add(ga);
 const ku=new THREE.Mesh(new THREE.BoxGeometry(1.4,.12,1.2),bm);ku.position.set(0,0,2);g.add(ku);
 const kanat=[];for(const s of[-1,1]){const p=new THREE.Group(),w=new THREE.Mesh(new THREE.BoxGeometry(3.6,.12,1.5),km);w.position.x=s*1.8;p.add(w);p.position.x=s*.6;g.add(p);kanat.push({p,s})}
 g.scale.setScalar(1.7);return{g,kanat}}
/* ---- hediye ---- */
function hediye(u,h){const t=now(),sr=sirali(),i=sr.indexOf(u),ad=x=>OY.kisaAd(x.ad,10);
 switch(h.sinif){
  case'gul':u.brulor=Math.min(Math.max(t,u.brulor)+3000*h.adet,t+12000);yak(u,4);return'🔥 3 sn tam alev!';
  case'kalp':u.kalkan=Math.max(t,u.kalkan||0)+20000;return'🛡️ 20 sn koruma';
  case'parfum':{const hd=i>0?sr[i-1]:sr[1];if(!hd)return'🪨 gökyüzünde kimse yok';if(korunuyor(hd))return`🪨 ${ad(hd)} korumalı!`;
   hd.agir=Math.max(t,hd.agir)+6000;hd.hiz=0;return`🪨 ${ad(hd)} 6 sn iniyor`}
  case'donut':{const hd=sr[0]!==u?sr[0]:sr[1];if(!hd)return'🦅 kartal boş döndü';if(korunuyor(hd))return`🦅 ${ad(hd)} korumalı!`;
   hd.donuk=Math.max(hd.donuk||0,t+5000);hd.kartal=t+5000;hd.hiz=0;const k=kartalMesh();k.g.position.set(hd.o.position.x+60,hd.o.position.y+30,hd.o.position.z);S.add(k.g);KARTAL.push({...k,hedef:hd,bit:t+5000,t0:t});OY.ses.yanlis();return`🦅 ${ad(hd)} 5 sn hava kaçırıyor`}
  case'sapka':u.termal=Math.max(t,u.termal)+12000;u.kalkan=Math.max(t,u.kalkan||0)+12000;u.x2bit=Math.max(t,u.x2bit||0)+12000;yak(u,6);return'🌀 12 sn 2x + koruma';
  case'galaksi':{ruzgar=t+4000;let n=0;for(const x of BAL)if(x!==u&&!korunuyor(x)){x.irt*=.85;x.savrul=t+4000;x.hiz*=.3;n++}
   u.irt+=25;u.x2bit=Math.max(t,u.x2bit||0)+12000;u.kalkan=Math.max(t,u.kalkan||0)+4000;OY.ses.patla();return`🌪️ +25 m · ${n} balon savruldu`}
 }return''}
/* ---- olaylar ---- */
OY.basla({muzik:'sakin',olay:e=>{
 if(!e.id||bitis)return;const u=kul(e);if(!katil(u))return;
 if(e.t==='begeni')yak(u,(e.adet||1)*.35);
 else if(e.t==='yorum'){yak(u,1.2);u.msj=String(e.metin||'').slice(0,40);u.msjT=now()}
 else if(e.t==='takip'){yak(u,5);OY.akis(`➕ ${u.ad} takip etti · yükseldi`,'#bdf')}
 else if(e.t==='paylasim'){yak(u,4);OY.akis(`🔁 ${u.ad} paylaştı · yükseldi`,'#bdf')}
 else if(e.t==='hediye'){const h=OY.hediye(e),n=h.elmas*h.adet;yak(u,4+Math.min(12,Math.sqrt(n)*2));OY.ses.guc();const et=hediye(u,h),k=HED_K[h.sinif];
  OY.vitrin(u,k[0],k[1],et);OY.akis(`${k[0]} ${u.ad}: ${et}`,'#ffd84a')}
}});
/* ---- irtifa cubugu: herkes nokta, ilk 3 foto ---- */
const IB=document.getElementById('irtbar'),AV={},NK={};
function cubuk(sr){const ilk=sr.slice(0,3),tavan=Math.max(60,(sr[0]?sr[0].irt:0)*1.08),yer=u=>`calc(${Math.min(1,u.irt/tavan)}*(100% - 1vh))`;
 for(const k in AV)if(!ilk.find(u=>u.id===k)){AV[k].remove();delete AV[k]}

 for(const u of sr){if(ilk.includes(u))continue;let d=NK[u.id];if(!d){d=NK[u.id]=document.createElement('i');IB.appendChild(d)}d.style.bottom=yer(u)}
 ilk.forEach((u,i)=>{let a=AV[u.id];if(!a){a=AV[u.id]=document.createElement('img');IB.appendChild(a)}const f=OY.foto(u,64);if(a._s!==f.surum||!a.src){a._s=f.surum;a.src=f.toDataURL()}a.className='r'+(i+1);a.style.bottom=yer(u)})}
/* ---- isim etiketleri (DOM, cakisma onleyici) ---- */
const ETK=document.getElementById('etk'),ET={},DB={};

 e=ET[u.id]={el,img:el.firstChild,em:el.children[1],sp:el.children[2],tac:el.children[3],key:'',cls:'',w:0,h:0,fs:-1}}

const V=new THREE.Vector3();

function cakis(a,L){for(const b of L)if(a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y)return true;return false}
function etiketler(sr,t){const L=[],ust=H()*.17,alt=H()*.84;
 const pr=sr.map((u,i)=>({u,i,p:i<3?i:(OY.korunuyor(u)||OY.donuk(u)||t<u.agir||t<u.brulor?10:20)+(t-u.son<4000?0:5)+i*.01})).sort((a,b)=>a.p-b.p);
 for(const {u,i} of pr){if(!u.o)continue;const e=etiket(u),p=u.o.position,s=ekranda(p.x,p.y+14,p.z);
  const metin=OY.kisaAd(u.ad,i<3?12:9)+durumIkon(u,t),tam='et'+(i<3?' r'+(i+1):''),key=metin+'|'+tam+'|'+i;
  if(e.key!==key){e.key=key;e.sp.textContent=metin;e.em.textContent=i+1;e.tac.textContent=i===0?'👑':'';sinifYap(e,tam);e.w=e.el.offsetWidth;e.h=e.el.offsetHeight}
  if(!s.on||s.y<ust||s.y>alt){sinifYap(e,'et hd');gizBalon(u);continue}
  const ek=i===0?H()*.024:0;let r={x:s.x-e.w/2,y:s.y-e.h-ek,w:e.w,h:e.h+ek},mod=tam;
  if(cakis(r,L)){let bul=null;if(i<3){for(const[ox,oy]of[[0,-1.15],[.6,0],[-.6,0],[.6,-1.15],[-.6,-1.15],[0,1.15],[1.1,0],[-1.1,0]]){const r2={...r,x:r.x+ox*r.w,y:r.y+oy*e.h};if(!cakis(r2,L)){bul=r2;break}}if(!bul)bul=r}
   if(bul)r=bul;else{const m=H()*.027;r={x:s.x-m/2,y:s.y-m,w:m,h:m};mod=cakis(r,L)?'et hd':tam+' mini'}}
  sinifYap(e,mod);if(mod==='et hd'){gizBalon(u);continue}
  r.x=Math.max(4,Math.min(W()-r.w-4,r.x));
  L.push(r);e.el.style.transform=`translate(${Math.round(r.x)}px,${Math.round(r.y+(mod===tam?ek:0))}px)`;
