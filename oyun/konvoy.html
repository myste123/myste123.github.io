 // 0-.45 gunduz, .45-.55 aksam, .55-.9 gece, .9-1 sabah

 if(tip==='drone'||tip==='vinc'){SINE=null;PLANG={tip,t0:t,sure:tip==='drone'?8000:6500,y:Math.random()<.5?1:-1};kes=true}
 else sineBasla(siradaki(),tip==='yorunge'?6500:5500,-1,tip)}
function kamHedef(t){let fov=46;
 if(SINE){const p=SINE.u.o.g.position,a=SINE.a,s=Math.min(1,(t-SINE.t0)/(SINE.bit-SINE.t0));
  switch(SINE.tip){
   case'kovala':TP.set(p.x+a*.9,1.3+Math.sin(t/900)*.06,p.z+6.6);TL.set(p.x,.95,p.z-6);fov=50;break;
   case'teker':TP.set(p.x+a*2.35,.55,p.z+2.8-5.6*s);TL.set(p.x,.65,p.z);fov=40;break;
   case'onden':TP.set(p.x+a*(1.3+s*1.2),.8,p.z-8.8+s*1.2);TL.set(p.x,.75,p.z);fov=36;break;
   case'yorunge':{const g=(.15+s*.6)*Math.PI;TP.set(p.x+a*Math.sin(g)*7.2,1.6+s*1.4,p.z-Math.cos(g)*7.2);TL.set(p.x,.8,p.z);fov=44;break}
   case'drift':TP.set(p.x+a*2.4,.75,p.z-10);TL.set(p.x,.7,p.z);fov=38;break;
   case'egzoz':TP.set(p.x+a*.8,.5,p.z+4.4);TL.set(p.x,.45,p.z+1.6);fov=42;break;
   case'cift':{const q=SINE.u2&&SINE.u2.o?SINE.u2.o.g.position:p,mx=(p.x+q.x)/2,zf=Math.min(p.z,q.z);TP.set(mx+a*2.2,1,zf-8.5);TL.set(mx,.8,(p.z+q.z)/2);fov=34;break}
   case'yukselt':{const g=s*Math.PI*.9;TP.set(p.x+a*Math.sin(g)*6.5,1.4+s*2,p.z-Math.cos(g)*6.5);TL.set(p.x,.8,p.z);fov=42;break}
   default:TP.set(p.x+a*1.8,2,p.z+7.5);TL.set(p.x,.9,p.z-5)}
  for(const v of ARAC){if(!v.o||v===SINE.u)continue;const q=v.o.g.position;if(Math.abs(TP.x-q.x)<1.5&&Math.abs(TP.z-q.z)<boyU(v)/2+.8&&TP.y<2.1)TP.y=2.1+(boyU(v)>4.6?.4:0)}}
 else if(PLANG){const[z0,z1]=sinir(),L=z1-z0,s=Math.min(1,(t-PLANG.t0)/PLANG.sure),y=PLANG.y;
  if(PLANG.tip==='drone'){const cz=z1+6-(L+12)*s;TP.set(y*(4+Math.sin(t/3000)*3),22+L*.12,cz+10);TL.set(0,0,cz-8);fov=52}
  else{const zc=(z0+z1)/2;TP.set(y*(YARI+2.2),1+8*s,zc-10+6*s);TL.set(0,1.2,zc);fov=46}}
 return fov}
function kamGuncelle(t,dt){
 if(SINE&&(t>SINE.bit||!SINE.u.o)){const o=SINE.onc;SINE=null;if(o>=0)ambT=t+3500+Math.random()*3000}
 if(PLANG&&t>PLANG.t0+PLANG.sure)PLANG=null;
 if(!SINE&&!PLANG)planSec(t);
 const fov=kamHedef(t);
 if(kes||ilkKam){KPr.copy(TP);KLr.copy(TL);kfov=fov;kes=false;ilkKam=false}
 else{const f=Math.min(1,dt*(SINE?6:2.5));KPr.lerp(TP,f);KLr.lerp(TL,f);kfov+=(fov-kfov)*Math.min(1,dt*3)}
 if(Math.abs(K.fov-kfov)>.01){K.fov=kfov;K.updateProjectionMatrix()}
 K.position.copy(KPr);LK.copy(KLr);K.lookAt(LK);K.updateMatrixWorld()}
