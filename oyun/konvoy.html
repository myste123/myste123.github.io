function boyut(){R.setPixelRatio(PR);R.setSize(W(),H());for(const c of[K,KF]){c.aspect=W()/H();c.updateProjectionMatrix()}

const yc=document.createElement('canvas');yc.width=256;yc.height=128;{const g=yc.getContext('2d');g.fillStyle='#45464f';g.fillRect(0,0,256,128);g.fillStyle='rgba(255,255,255,.9)';
 for(let i=1;i<SERIT;i++)g.fillRect(i*256/SERIT-2,0,4,64);g.fillStyle='#f4d35e';g.fillRect(2,0,5,128);g.fillRect(249,0,5,128)}

// bitis cizgisi (damali)
{const c=document.createElement('canvas');c.width=128;c.height=16;const g=c.getContext('2d');for(let i=0;i<16;i++)for(let j=0;j<2;j++){g.fillStyle=(i+j)%2?'#fff':'#111';g.fillRect(i*8,j*8,8,8)}
 const tx=new THREE.CanvasTexture(c);const m=new THREE.Mesh(new THREE.PlaneGeometry(SERIT*SG,1.6),new THREE.MeshBasicMaterial({map:tx}));m.rotation.x=-Math.PI/2;m.position.set(0,.04,-YOL);S.add(m)}

 if((-z)%45<15)UC.yerlestir('model/tatil/lights-colored.glb',0,6,z,0,SERIT*SG*.95,S)}
const salon=new THREE.Group();{const b=new THREE.Mesh(new THREE.BoxGeometry(34,11,9),new THREE.MeshLambertMaterial({color:0xfff2f7}));b.position.y=5.5;salon.add(b);
 const k=new THREE.Mesh(new THREE.TorusGeometry(6,.7,10,30,Math.PI),new THREE.MeshLambertMaterial({color:0xff6fa5}));k.position.set(0,0,4.8);salon.add(k);
 const lc=document.createElement('canvas');lc.width=512;lc.height=128;const g=lc.getContext('2d');g.fillStyle='#ff4d8d';g.fillRect(0,0,512,128);g.fillStyle='#fff';g.font='bold 62px Segoe UI';g.textAlign='center';g.fillText('💍 DÜĞÜN SALONU',256,86);
 const tx=new THREE.CanvasTexture(lc);tx.encoding=THREE.sRGBEncoding;const lv=new THREE.Mesh(new THREE.PlaneGeometry(16,4),new THREE.MeshBasicMaterial({map:tx}));lv.position.set(0,13,4.6);salon.add(lv)}
salon.position.z=-YOL-12;S.add(salon);
/* ---- arabalar ---- */
const U={},ARAC=[];let bitis=0,kazananU=null;
const hash=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);
const golgeTx=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,4,32,32,32);r.addColorStop(0,'rgba(0,0,0,.55)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const golgeM=new THREE.MeshBasicMaterial({map:golgeTx,transparent:true,depthWrite:false}),golgeG=new THREE.PlaneGeometry(3.2,5.6);
const topG=new THREE.SphereGeometry(.34,10,8),topM=[0xff4d8d,0xffffff,0xffd166].map(c=>new THREE.MeshLambertMaterial({color:c}));
// arac kademeleri: puan topladikca araba yukselir (ters: model on yuzu -z)
const KADEME=[{ad:"Toros'a",m:'toros',p:0},{ad:"Kartal'a",m:'kartal',p:30},{ad:"Golf'a",m:'golf7',p:90},{ad:"Passat'a",m:'passat',p:200},{ad:"BMW'ye",m:'bmw',p:400},{ad:"Mercedes'e",m:'mercedes',p:700,ters:1}];
const SAB={};
function sablon(ad,ters,boy=4.4){return SAB[ad]||(SAB[ad]=UC.yukle(`model/arac/${ad}.glb`).then(gl=>{const m=gl.scene.clone(true);
 m.traverse(o=>{if(o.name&&/^Plane/.test(o.name))o.visible=false});const sil=[];m.traverse(o=>{if(!o.visible)sil.push(o)});sil.forEach(o=>o.parent&&o.parent.remove(o));
 let b=new THREE.Box3().setFromObject(m),sz=b.getSize(new THREE.Vector3());if(sz.x>sz.z)m.rotation.y=Math.PI/2;if(!ters)m.rotation.y+=Math.PI;
 m.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(m);sz=b.getSize(new THREE.Vector3());m.scale.multiplyScalar(boy/sz.z);
 m.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(m);const c=b.getCenter(new THREE.Vector3());m.position.set(-c.x,-b.min.y,-c.z);
 m.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=false}});const g=new THREE.Group();g.add(m);g.userData.h=b.max.y-b.min.y;return g}))}
KADEME.forEach(k=>sablon(k.m,k.ters).catch(()=>{}));
const kademe=u=>{let i=0;KADEME.forEach((k,j)=>{if(u.puan>=k.p)i=j});return i};
function modelKoy(o,i){sablon(KADEME[i].m,KADEME[i].ters).then(t=>{if(o.kad!==i)return;if(o.model)o.g.remove(o.model);const m=t.clone(true);o.model=m;o.g.add(m);
 const h=t.userData.h;o.sus.position.y=h-2.0;o.gelin.position.y=h-2.0})}
function araba(u){const g=new THREE.Group(),o={g,model:null,kad:-1};
 const gl=new THREE.Mesh(golgeG,golgeM);gl.rotation.x=-Math.PI/2;gl.position.y=.05;g.add(gl);
 // kurdele + balonlar (Kalp)
 o.sus=new THREE.Group();for(let i=0;i<5;i++){const b=new THREE.Mesh(topG,topM[i%3]);b.position.set(-.9+i*.45,3.1+Math.sin(i*2)*.3,1.6);o.sus.add(b)}
 const kd=new THREE.Mesh(new THREE.BoxGeometry(.32,.07,4.3),new THREE.MeshLambertMaterial({color:0xff4d8d}));kd.position.y=2.02;o.sus.add(kd);
 const kd2=kd.clone();kd2.scale.set(1,1,.48);kd2.rotation.y=Math.PI/2;o.sus.add(kd2);o.sus.visible=false;g.add(o.sus);
 // gelin arabasi (Sapka): beyaz kurdele carpraz + kaputta buyuk fiyonk + altin hale
 o.gelin=new THREE.Group();{const bm=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x553344});
  for(const s of[-1,1]){const r=new THREE.Mesh(new THREE.BoxGeometry(.28,.07,4.6),bm);r.position.y=2.06;r.rotation.y=s*.42;o.gelin.add(r)}
  const fm=new THREE.MeshLambertMaterial({color:0xff6fa5,emissive:0x441022});for(const s of[-1,1]){const f=new THREE.Mesh(new THREE.TorusGeometry(.42,.16,8,16),fm);f.position.set(s*.45,1.75,-1.9);f.rotation.y=Math.PI/2;f.scale.set(1,1,.5);o.gelin.add(f)}
  const hl=new THREE.Mesh(new THREE.RingGeometry(2.2,2.9,32),new THREE.MeshBasicMaterial({color:0xffe27a,transparent:true,opacity:.7,side:THREE.DoubleSide,depthWrite:false}));hl.rotation.x=-Math.PI/2;hl.position.y=.08;o.gelin.add(hl);o.hale=hl}
 o.gelin.visible=false;g.add(o.gelin);
const hl0=o.hale;o.gelin.remove(hl0);g.add(hl0);
 o.nitro=new THREE.Mesh(new THREE.ConeGeometry(.45,2.6,10),new THREE.MeshBasicMaterial({color:0x4fd1ff,transparent:true,opacity:.8}));o.nitro.rotation.x=-Math.PI/2;o.nitro.position.set(0,.8,3.5);o.nitro.visible=false;g.add(o.nitro);
 S.add(g);o.kad=kademe(u);modelKoy(o,o.kad);return o}
function kul(e){let u=U[e.id];if(!u)u=U[e.id]={id:e.id,ad:e.ad||'?',foto:e.foto,yol:0,hiz:0,nitroBit:0,yavas:0,gelinBit:0,ucus:0,ucusYol:0,o:null,son:0,msj:'',msjT:0,serit:2,puan:0};if(e.foto&&!u.foto)u.foto=e.foto;return u}
const ort=()=>ARAC.length?ARAC.reduce((a,b)=>a+b.yol,0)/ARAC.length:0;
function katil(u){if(u.o)return true;if(ARAC.length>=25){const e=ARAC.reduce((a,b)=>a.son<b.son?a:b);if(now()-e.son<25000)return false;atil(e)}
 u.serit=ARAC.length%SERIT;u.yol=Math.max(0,ort()-15);u.o=araba(u);u.o.g.position.set((u.serit-2)*SG,0,-u.yol);u.son=now();ARAC.push(u);OY.akis(`🚗 ${u.ad} konvoya katıldı`,'#bff');OY.ses.korna();return true}
function atil(e){S.remove(e.o.g);e.o=null;ARAC.splice(ARAC.indexOf(e),1);if(ET[e.id]){ET[e.id].el.remove();delete ET[e.id]}}
const korunuyor=u=>OY.korunuyor(u);
function puanEkle(u,n){u.puan+=n;if(!u.o)return;const k=kademe(u);if(k>u.o.kad){u.o.kad=k;modelKoy(u.o,k);OY.akis(`⬆️ ${u.ad} ${KADEME[k].ad} geçti!`,'#ffd84a');OY.ses.korna();
 const p=u.o.g.position;fisek(p.x,5,p.z);sineBasla(u,4000,1)}}
function gaz(u,n){u.son=now();if(OY.donuk(u))return;u.hiz=Math.min(13,u.hiz+n)}
/* ---- efektler ---- */
let POLIS=[],HALAY=null,FISEK=[];
sablon('polis',1).catch(()=>{});
function polisGetir(hedef){const g=new THREE.Group();sablon('polis',1,4.6).then(t=>{const m=t.clone(true);g.add(m)});
 const lm=[new THREE.MeshBasicMaterial({color:0xff2030}),new THREE.MeshBasicMaterial({color:0x2060ff})];const l=[];
 for(const s of[-1,1]){const k=new THREE.Mesh(new THREE.BoxGeometry(.36,.18,.3),lm[s>0?1:0]);k.position.set(s*.32,1.5,0);g.add(k);l.push(k)}
 const dur=new THREE.Sprite(new THREE.SpriteMaterial({map:yaziTx('✋ DUR','#e8202e'),depthTest:false}));dur.scale.set(3.4,1.3,1);dur.position.set(0,4.4,0);dur.renderOrder=5;g.add(dur);
 const x=(hedef.serit-2)*SG;g.position.set(x+(x>=0?14:-14),0,-hedef.yol-7);S.add(g);POLIS.push({g,hedef,x,t0:now(),bit:now()+5000,l,lm})}

 g.fillStyle='#fff';g.font='900 52px Nunito,Segoe UI,Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(y,128,52);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
// halay ekibi: 5 karakter, hedeflenen ilk 3'un onunde yolu keser
const HK=[];(async()=>{for(let i=0;i<5;i++){try{const m=await UC.ornek(UC.KARAKTER[(i*3)%UC.KARAKTER.length],4);m.sahne.visible=false;S.add(m.sahne);m.oynat('walk',{hiz:1.3});HK.push(m)}catch(e){}}})();

const KIV=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'#fff');r.addColorStop(.35,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,32,32);return new THREE.CanvasTexture(c)})();
function fisek(x,y,z){const n=80,p=new Float32Array(n*3),v=[];for(let i=0;i<n;i++){p[i*3]=x;p[i*3+1]=y;p[i*3+2]=z;const a=Math.random()*6.283,b=Math.acos(Math.random()*2-1),s=7+Math.random()*3;

/* ---- hediye ---- */
function hediye(u,h){const t=now(),sr=sirali(),i=sr.indexOf(u),ad=x=>OY.kisaAd(x.ad,10);let et='';
 switch(h.sinif){
  case'gul':u.nitroBit=Math.min(Math.max(t,u.nitroBit)+3000*h.adet,t+12000);gaz(u,4);et='🚀 3 sn turbo!';break;
  case'kalp':u.kalkan=Math.max(t,u.kalkan||0)+20000;et='🎀 Kurdele: 20 sn koruma';break;
  case'parfum':{const hd=i>0?sr[i-1]:sr[1];if(!hd){et='👮 yolda kimse yok';break}
   if(korunuyor(hd)){et=`👮 ${ad(hd)} kurdeleli, polis geçti`;break}
   hd.donuk=t+5000;hd.hiz=0;polisGetir(hd);et=`👮 ${ad(hd)} 5 sn çevrildi`;break}
  case'donut':{const hd=sr.slice(0,4).filter(x=>x!==u).slice(0,3).filter(x=>!korunuyor(x));if(!hd.length){et='💃 halay ekibi: herkes korumalı';break}
   for(const x of hd)x.yavas=t+6000;halayBasla(hd);et=`💃 ${hd.length} rakip 6 sn yavaş`;break}
  case'sapka':u.gelinBit=Math.max(t,u.gelinBit)+15000;u.kalkan=Math.max(t,u.kalkan||0)+15000;u.x2bit=Math.max(t,u.x2bit||0)+15000;gaz(u,8);et='👰 15 sn 2x hız + koruma';break;
  case'galaksi':{u.ucus=1;u.ucusYol=40;u.x2bit=Math.max(t,u.x2bit||0)+20000;u.kalkan=Math.max(t,u.kalkan||0)+5000;let n=0;
   for(const x of ARAC)if(x!==u&&!korunuyor(x)){x.donuk=Math.max(x.donuk||0,t+3000);x.izle=t+3000;x.hiz*=.3;n++}
   const p=u.o.g.position;for(let k=0;k<5;k++)setTimeout(()=>fisek(p.x+(Math.random()-.5)*14,7+Math.random()*6,p.z-6-Math.random()*16),k*380);
   et=`🎆 40 m uçtu · ${n} araba durdu`;break}
 }
 return et}
/* ---- olaylar ---- */
const BAL={};let KAL={kazan:{},tur:0};
OY.basla({muzik:'dugun',olay:e=>{
 if(e.t==='kalici'&&e.veri&&e.veri.kazan){KAL=Object.assign({kazan:{},tur:0},e.veri);return}

 if(e.t==='begeni'){gaz(u,(e.adet||1)*.9);puanEkle(u,e.adet||1)}
 else if(e.t==='yorum'){gaz(u,2.5);puanEkle(u,2);u.msj=String(e.metin||'').slice(0,40);u.msjT=now()}
