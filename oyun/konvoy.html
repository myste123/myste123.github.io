function cevreGuncelle(t,dt){
 // 0-.42 gunduz, .42-.5 aksam, .5-.92 gece, .92-1 sabah

 const isik=Math.min(1,gece+bul*.35);havuzM.opacity=isik*(.75+HW.yagmur*.35);parlakM.opacity=isik;basM.emissive.copy(C_LAMBA).multiplyScalar(isik);

 kok.traverse(o=>{if(!o.isMesh||!o.visible||Array.isArray(o.material)||haric&&haric.has(o))return;let a=grup.get(o.material);if(!a)grup.set(o.material,a=[]);a.push(o)});
 const g=new THREE.Group(),v=new THREE.Vector3(),nm=new THREE.Matrix3();

  case'galaksi':{u.ucus=1;const p=u.o.g.position;for(let k=0;k<5;k++)setTimeout(()=>fisek(p.x+(Math.random()-.5)*14,7+Math.random()*6,p.z-4-Math.random()*14),k*380);
   ARAC.forEach((x,i)=>setTimeout(()=>{if(x.o)patlat(x.o.g.position,1)},400+i*110));for(let k=0;k<4;k++)setTimeout(()=>KORNA(1),k*500);et='🎆 havai fişek · konvoy coştu';break}
 }
 return et}

function etiketler(sr,t){const L=[];
 // HUD bolgeleri: etiket buralara konmaz

 for(const {u,i} of pr){if(!u.o)continue;const e=etiket(u),p=u.o.g.position,s=ekranda(p.x,p.y+2.3,p.z);
  const metin=OY.kisaAd(u.ad,i<3?12:9)+durumIkon(u,t),tam='et'+(i<3?' r'+(i+1):''),key=metin+'|'+tam+'|'+i;
  if(e.key!==key){e.key=key;e.sp.textContent=metin;e.em.textContent=i+1;e.tac.textContent=i===0?'👑':'';sinifYap(e,tam);const fs=H()*(i===0?.0165:.0145);OLC.font=`800 ${fs}px Nunito,Segoe UI,Arial`;e.w=Math.ceil(OLC.measureText(metin).width+H()*(i===0?.075:.068));e.h=Math.ceil(H()*(i===0?.036:.032))}
  if(!s.on||s.y<ust||s.y>alt||(SINE&&SINE.u!==u&&SINE.u2!==u)){sinifYap(e,'et hd');gizBalon(u);continue}
  const ek=i===0?H()*.024:0;let r={x:s.x-e.w/2,y:s.y-e.h-ek,w:e.w,h:e.h+ek},mod=tam;
  if(cakis(r,L)){let bul=null;if(i<3){for(const[ox,oy]of[[0,-1.15],[.6,0],[-.6,0],[.6,-1.15],[-.6,-1.15],[0,-2.3],[1.1,0],[-1.1,0]]){const r2={...r,x:r.x+ox*r.w,y:r.y+oy*e.h};if(!cakis(r2,L)){bul=r2;break}}if(!bul)bul=r}
   if(bul)r=bul;else{const m=H()*.027;r={x:s.x-m/2,y:s.y-m,w:m,h:m};mod=cakis(r,L)?'et hd':tam+' mini'}}
  sinifYap(e,mod);if(mod==='et hd'){gizBalon(u);continue}
  L.push(r);e.el.style.transform=`translate(${Math.round(r.x)}px,${Math.round(r.y+(mod===tam?ek:0))}px)`;

   if(b.textContent!==u.msj){b.textContent=u.msj;b._w=0}if(!b._w){b._w=b.offsetWidth;b._h=b.offsetHeight}
   const rb={x:s.x-b._w/2,y:r.y-b._h-4,w:b._w,h:b._h};if(rb.y>ust&&!cakis(rb,L)){L.push(rb);b.style.display='block';b.style.transform=`translate(${Math.round(rb.x)}px,${Math.round(rb.y)}px)`}else b.style.display='none'}
  else if(b){b.remove();delete BAL[u.id]}}

/* ---- kamera: surekli hareket eden sinematik planlar, konvoyun basindan sonuna herkesi gezer ---- */
let PIT=.9;
function kamKur(c,D,lz,x){c.position.set(x,D*Math.sin(PIT),lz+D*Math.cos(PIT));c.lookAt(x*.3,0,lz);c.updateMatrixWorld()}
function sigar(D,lz,on,arka,x){kamKur(KF,D,lz,x);const P=[[-YARI-.5,0,arka],[YARI+.5,0,arka],[-YARI,0,on],[YARI,0,on],[0,5,on]];
 for(const q of P){V.set(q[0],q[1],q[2]).project(KF);if(V.z>1||Math.abs(V.x)>.94||Math.abs(V.y)>BANT)return false}return true}
function kadraj(on,arka,x){let lz=(on+arka)/2,D=40;
 for(let pas=0;pas<2;pas++){let a=12,b=320;for(let k=0;k<12;k++){const m=(a+b)/2;if(sigar(m,lz,on,arka,x))b=m;else a=m}D=b;
  kamKur(KF,D,lz,x);V.set(0,5,on).project(KF);const yu=V.y;V.set(0,0,arka).project(KF);const ya=V.y;lz-=(yu+ya)/2*(arka-on)*.55}
 return{D,lz}}
const PLAN=['tarama','genel','yan','on','tarama','arka','genel','yan'];
let plan=0,planT0=-1e9,planSure=0,planYon=1,SINE=null,sonSine=0,kamD=40,ilkKam=true;
const KPr=new THREE.Vector3(0,30,30),KLr=new THREE.Vector3(),TP=new THREE.Vector3(),TL=new THREE.Vector3(),LK=new THREE.Vector3();
function sineBasla(u,sure=4200,oncelik=0,tip,u2){const t=now();if(!u||!u.o||(SINE&&t<SINE.bit&&(!oncelik||SINE.onc&&t-SINE.t0<2000)))return;
 SINE={u,u2,onc:oncelik,t0:t,bit:t+sure,tip:tip||['takip','on','kenar','takip','on'][Math.random()*5|0],a:u.kol===0?-1:u.kol===2?1:(Math.random()<.5?1:-1)};sonSine=t}
function sinir(){let a=Infinity,b=-Infinity;for(const u of ARAC){if(!u.o)continue;const z=u.o.g.position.z;if(z<a)a=z;if(z>b)b=z}return isFinite(a)?[a,b]:[0,10]}
function kamHedef(t){
 if(SINE){const p=SINE.u.o.g.position,a=SINE.a;
  if(SINE.tip==='cift'&&SINE.u2&&SINE.u2.o){const q=SINE.u2.o.g.position,mx=(p.x+q.x)/2,mz=(p.z+q.z)/2;TP.set(mx+a*5.5,4.6,mz+9);TL.set(mx,.4,mz-1.5);return}
  if(SINE.tip==='takip'){TP.set(p.x+a*1.8,p.y+2,p.z+7.5);TL.set(p.x,p.y+.9,p.z-5)}
  else if(SINE.tip==='on'){TP.set(p.x+a*2.6,p.y+1.3,p.z-8.5);TL.set(p.x,p.y+.8,p.z)}
  else{TP.set(a*(YARI+2.5),1.6,p.z-9);TL.set(p.x,p.y+.8,p.z)}return}
 const[z0,z1]=sinir(),L=z1-z0,s=Math.min(1,(t-planT0)/planSure),y=planYon;
 switch(PLAN[plan]){
  case'tarama':{const cz=z0-8+(L+16)*s;TP.set(y*9.5,5.4,cz+4);TL.set(-y*1.5,.8,cz-7);break}
  case'yan':{const cz=z1+8-(L+16)*s;TP.set(y*11,2.3,cz);TL.set(0,1,cz-4);break}
  case'on':TP.set(y*(3+3*s),2.2+7*s,z0-13-6*s);TL.set(0,1,z0+Math.min(L,30)*.5);break;
  case'arka':{const cz=z1+18-Math.min(L,60)*.7*s;TP.set(y*3,4+5*s,cz);TL.set(0,.5,cz-26);break}
  default:{PIT=.95;const k=kadraj(z0-4,z1+4,0);if(isFinite(k.D))kamD+=(k.D-kamD)*.08;const sx=Math.sin(t/4200)*5;TP.set(sx,kamD*Math.sin(PIT),k.lz+kamD*Math.cos(PIT));TL.set(sx*.3,0,k.lz)}}}
function kamGuncelle(t,dt){if(SINE&&(t>SINE.bit||!SINE.u.o)){planT0+=t-SINE.t0;SINE=null;ambT=t+2500+Math.random()*2500}
 if(!SINE&&t-planT0>planSure){plan=(plan+1)%PLAN.length;planT0=t;planYon=Math.random()<.5?1:-1;const[z0,z1]=sinir(),L=z1-z0,A=PLAN[plan];
  planSure=A==='tarama'||A==='yan'?7000+L*90:A==='genel'?8000:7000}
 kamHedef(t);const f=ilkKam?1:Math.min(1,dt*(SINE?3:1.3));ilkKam=false;KPr.lerp(TP,f);KLr.lerp(TL,f);
 K.position.copy(KPr);LK.copy(KLr);K.lookAt(LK);K.updateMatrixWorld()}

 ambiyans(t);aracGuncelle(t,dt);dumanGuncelle(t,dt);alevGuncelle(t,dt);
 FISEK=FISEK.filter(f=>{const a=(t-f.t0)/1000;if(a>1.7){S.remove(f.P);f.P.geometry.dispose();f.P.material.dispose();return false}
  const p=f.P.geometry.attributes.position.array;for(let i=0;i<f.v.length;i+=3){p[i]+=f.v[i]*dt;p[i+1]+=f.v[i+1]*dt;p[i+2]+=f.v[i+2]*dt;f.v[i+1]-=5*dt;f.v[i]*=.985;f.v[i+2]*=.985}
