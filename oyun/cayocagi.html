<script>

   Yorum = kuleye 1 bardak (senin renginde tabak). Her kat 6 bardak; o katta EN ÇOK bardağı olan katı kapar (+15 puan, kat ayakta kaldıkça).

const R=new THREE.WebGLRenderer({canvas:document.getElementById('sahne'),antialias:!DAR,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,DAR?1.25:1.5));R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.background=new THREE.Color(0x24160e);S.fog=new THREE.Fog(0x24160e,30,60);
const K=new THREE.PerspectiveCamera(48,1,.1,200);

S.add(new THREE.HemisphereLight(0xfff0dc,0x3a2414,.75));const L=new THREE.DirectionalLight(0xffe2b8,.85);L.position.set(6,14,14);S.add(L);S.add(L.target);
const sicak=new THREE.PointLight(0xff9a40,.9,40,1.6);S.add(sicak);
// ---- arka plan: koyu, dusuk kontrastli ahsap lambri (goz yormaz) ----
const dc=document.createElement('canvas');dc.width=256;dc.height=512;{const g=dc.getContext('2d');for(let i=0;i<8;i++){g.fillStyle=['#3a2516','#362214','#3d2718','#382315'][i%4];g.fillRect(i*32,0,32,512);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(i*32,0,2,512)}
 g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,250,256,10);g.fillStyle='rgba(255,220,180,.05)';g.fillRect(0,246,256,4)}

const duvar=new THREE.Mesh(new THREE.PlaneGeometry(70,200),new THREE.MeshLambertMaterial({map:dtx,color:0x9a8a80}));duvar.position.set(0,90,-7);S.add(duvar);
// tezgah
const tez=new THREE.Mesh(new THREE.BoxGeometry(18,1.2,7),new THREE.MeshLambertMaterial({color:0x6b4426}));tez.position.set(0,-.6,0);S.add(tez);
const tezU=new THREE.Mesh(new THREE.BoxGeometry(18.4,.18,7.4),new THREE.MeshLambertMaterial({color:0x8a5a32}));tezU.position.y=-.05;S.add(tezU);
// ---- malzemeler / parcalar ----
const camM=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.18,roughness:.05,metalness:.1,depthWrite:false}),
 cayM=new THREE.MeshStandardMaterial({color:new THREE.Color(0x8c1d06).convertSRGBToLinear(),emissive:new THREE.Color(0x3a0800).convertSRGBToLinear(),roughness:.2,metalness:.1}),
 gumus=new THREE.MeshStandardMaterial({color:0xd5d5da,metalness:.75,roughness:.3}),bakir=new THREE.MeshStandardMaterial({color:0xc06a35,metalness:.6,roughness:.35}),
 altin=new THREE.MeshStandardMaterial({color:0xffc83a,metalness:.85,roughness:.25,emissive:0x3a2600});
const V2=a=>a.map(p=>new THREE.Vector2(p[0],p[1]));
const bardakG=new THREE.LatheGeometry(V2([[0,0],[.36,0],[.4,.08],[.34,.45],[.27,.78],[.33,1.05],[.44,1.32],[.46,1.42]]),14),
 cayG=new THREE.LatheGeometry(V2([[0,.05],[.33,.06],[.3,.45],[.24,.78],[.3,1.05],[.38,1.22],[0,1.22]]),12),
 tabakG=new THREE.CylinderGeometry(.62,.5,.1,18),tepsiG=new THREE.CylinderGeometry(2.35,2.25,.16,32),kenarG=new THREE.TorusGeometry(2.33,.07,6,40);
const KH=1.74,YUVA=6,YR=1.42; // kat yuksekligi, kattaki bardak sayisi, halka yaricapi
const renkM={};function urenk(u){if(!renkM[u.id]){const h=[...String(u.id||u.ad)].reduce((a,b)=>a+b.charCodeAt(0),0)*47%360;renkM[u.id]=new THREE.MeshLambertMaterial({color:new THREE.Color(`hsl(${h},75%,55%)`)});renkM[u.id].css=`hsl(${h},75%,58%)`}return renkM[u.id]}
function bardak(u){const g=new THREE.Group();const t=new THREE.Mesh(tabakG,urenk(u));t.position.y=.05;g.add(t);const c=new THREE.Mesh(cayG,cayM);c.position.y=.1;g.add(c);const b=new THREE.Mesh(bardakG,camM);b.position.y=.1;b.renderOrder=2;g.add(b);return g}
function tepsi(mat){const g=new THREE.Group();g.add(new THREE.Mesh(tepsiG,mat));const k=new THREE.Mesh(kenarG,mat);k.rotation.x=Math.PI/2;k.position.y=.08;g.add(k);return g}
function semaver(){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.LatheGeometry(V2([[0,0],[.55,0],[.6,.15],[.45,.3],[.75,.55],[.8,1.0],[.6,1.25],[.3,1.35],[.35,1.5],[0,1.55]]),18),gumus));
 const m=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.5,6),gumus);m.rotation.z=Math.PI/2.4;m.position.set(.85,.6,0);g.add(m);return g}
// ---- kat bayragi: foto + kat no + ad ----
function bayrakTex(u,kat,renk){const c=document.createElement('canvas');c.width=320;c.height=72;const g=c.getContext('2d');g.fillStyle='rgba(15,8,3,.8)';g.beginPath();g.roundRect?g.roundRect(3,3,314,66,33):g.rect(3,3,314,66);g.fill();
 g.strokeStyle=renk;g.lineWidth=5;g.stroke();g.drawImage(OY.foto(u,64),7,4,64,64);g.fillStyle='#ffd166';g.font='900 27px Nunito,Segoe UI,Arial';g.textBaseline='middle';g.fillText(kat+'.',80,38);
 const x=80+g.measureText(kat+'.').width+10;g.fillStyle='#fff';g.font='800 28px Nunito,Segoe UI,Arial';g.fillText(OY.kisaAd(u.ad,11),x,38);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
// ---- yuzen yazi ----
const YAZI=[];function yazi(m,x,y,z,renk='#ffd166',boy=1){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');g.font='900 58px Nunito,Segoe UI,Arial';g.textAlign='center';g.textBaseline='middle';
 g.lineWidth=10;g.strokeStyle='rgba(0,0,0,.75)';g.strokeText(m,256,50);g.fillStyle=renk;g.fillText(m,256,50);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
 s.scale.set(5.2*boy,.98*boy,1);s.position.set(x,y,z);s.renderOrder=20;s.t0=now();S.add(s);YAZI.push(s);while(YAZI.length>4){const o=YAZI.shift();S.remove(o);o.material.map.dispose()}}
// ---- durum ----
const U={},TG=new THREE.Group();S.add(TG);
let KATLAR=[],KAT=null,SAL=0,yon=1,yikilis=0,koruBit=0,garsonBit=0,turBas=now(),bitis=0,KAL={rekor:0};const TUR=240,BEK=[];
function kul(e){let u=U[e.id];if(!u)u=U[e.id]={id:e.id,ad:e.ad||'?',foto:e.foto,katki:0,kat:0,sonB:0};if(e.foto&&!u.foto)u.foto=e.foto;return u}
const puan=u=>u.katki+15*u.kat;
const taban=tepsi(bakir);taban.position.y=.08;TG.add(taban);
const kelepce=new THREE.Mesh(new THREE.TorusGeometry(2.6,.12,8,40),new THREE.MeshBasicMaterial({color:0xbfe8ff,transparent:true,opacity:0}));kelepce.rotation.x=Math.PI/2;TG.add(kelepce);let kelT=-9e9;
const KALICI=[taban,kelepce];
function yeniKat(){KAT={y:KATLAR.length*KH+.16,bardak:[],say:{},sira:{}}}
yeniKat();
function katLideri(k){let en=null,es=-1;for(const id in k.say){const v=k.say[id];if(v>es||(v===es&&k.sira[id]<k.sira[en])){es=v;en=id}}return en?U[en]:null}
// bardak kuyrugu: sirayla, animasyonlu dusurulur
function bardakKoy(u,n=1){for(let i=0;i<n;i++)BEK.push(u)}
function bardakIsle(){if(!BEK.length||yikilis||bitis||KAT.bitti)return;const u=BEK.shift();const k=KAT,i=k.bardak.length,a=i/YUVA*Math.PI*2+(KATLAR.length%2)*.52+.26;
 const b=bardak(u);b.position.set(Math.cos(a)*YR,k.y+7,Math.sin(a)*YR);b.userData={hy:k.y,vy:0,u};TG.add(b);k.bardak.push(b);k.say[u.id]=(k.say[u.id]||0)+1;if(k.sira[u.id]===undefined)k.sira[u.id]=i;
 u.katki++;if(i+1>=YUVA){k.bitti=1;setTimeout(katBitir,450)}}
function katBitir(){const k=KAT;if(!k||yikilis||bitis)return;const sahip=katLideri(k);const no=KATLAR.length+1;
 const tp=tepsi(gumus);tp.position.set(0,k.y+KH+5,0);tp.userData={hy:k.y+KH-.08,vy:0};TG.add(tp);
 const sag=no%2?1:-1,bay=new THREE.Sprite(new THREE.SpriteMaterial({map:bayrakTex(sahip,no,urenk(sahip).css)}));bay.scale.set(2.75,.62,1);bay.position.set(sag*3.6,k.y+.95,.4);bay.renderOrder=5;TG.add(bay);
 const cub=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1.3,5),gumus);cub.rotation.z=Math.PI/2;cub.position.set(sag*2.1,k.y+.95,.3);TG.add(cub);
 KATLAR.push({...k,no,sahip,tp,bay,cub});sahip.kat++;
 SAL+=3+no*.45;OY.ses.dogru();yazi(`${no}. KAT → ${OY.kisaAd(sahip.ad,10)}`,0,k.y+KH+2.4,1,'#ffd166',.9);OY.akis(`🏗 ${no}. kat ${sahip.ad}'in! (+15)`,'#ffd166');
 if(no>KAL.rekor){KAL.rekor=no;OY.kaydet(KAL)}yeniKat()}
function sahipDegis(kat,u){kat.sahip.kat--;kat.sahip=u;u.kat++;kat.bay.material.map.dispose();kat.bay.material.map=bayrakTex(u,kat.no,urenk(u).css);kat.bay.material.needsUpdate=true}
function yik(){if(yikilis)return;yikilis=now();OY.ses.patla();const n=KATLAR.length;OY.akis(`💥 KULE YIKILDI! ${n} katın puanı gitti`,'#ff7b6b');yazi('💥 YIKILDI!',0,KAT.y+2,2,'#ff7b6b',1.3);
 TG.children.forEach(o=>{if(KALICI.includes(o))return;o.visible=true;o.userData.dv=new THREE.Vector3((Math.random()-.5)*8+yon*6,2+Math.random()*5,(Math.random()-.2)*5);o.userData.dr=(Math.random()-.5)*8});
 for(const k of KATLAR)k.sahip.kat=0;BEK.length=0}
function sifirla(){TG.children.slice().forEach(o=>{if(!KALICI.includes(o))TG.remove(o)});KATLAR=[];SAL=0;TG.rotation.z=0;yikilis=0;yeniKat()}
// ---- garson (Parfum): merdivene cikip kuleyi tutar ----
let garson=null;const merdiven=new THREE.Group(),merM=new THREE.MeshLambertMaterial({color:0x8a6a45}),basG=new THREE.BoxGeometry(.9,.07,.08);merdiven.visible=false;S.add(merdiven);
const rayG=new THREE.BoxGeometry(.12,1,.12),raylar=[-.45,.45].map(x=>{const r=new THREE.Mesh(rayG,merM);r.position.x=x;merdiven.add(r);return r});let merBoy=-1;
function merdivenKur(h){const n=Math.max(1,Math.round(h/.5));if(n===merBoy)return;merBoy=n;merdiven.children.slice(2).forEach(o=>merdiven.remove(o));raylar.forEach(r=>{r.scale.y=h;r.position.y=h/2});
 for(let i=0;i<n;i++){const b=new THREE.Mesh(basG,merM);b.position.y=(i+.6)*h/n;merdiven.add(b)}}
UC.ornek('model/karakter/character-male-c.glb',1).then(m=>{const b=new THREE.Box3().setFromObject(m.sahne);m.sahne.scale.setScalar(2.6/Math.max(.01,b.max.y-b.min.y));garson=m;m.sahne.visible=false;S.add(m.sahne);m.oynat('interact-left')}).catch(()=>{});
// ---- ruzgar cizgileri (Donut) ----
const RUZ=[];for(let i=0;i<14;i++){const r=new THREE.Mesh(new THREE.PlaneGeometry(2.6,.06),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));S.add(r);RUZ.push(r)}let ruzBit=0;
// ---- olaylar ----
let begSn=0,sonBp=0;
OY.basla({muzik:'sakin',olay:e=>{
 if(e.t==='kalici'&&e.veri&&e.veri.rekor!==undefined){KAL=e.veri;return}
 if(!e.id||bitis)return;const u=kul(e),t=now();
 if(e.t==='yorum'){if(t-u.sonB>1500){u.sonB=t;bardakKoy(u,1)}}
 else if(e.t==='takip'||e.t==='paylasim'){bardakKoy(u,2);OY.akis(`${e.t==='takip'?'➕':'🔁'} ${u.ad} +2 bardak`,'#ffe9b0')}
 else if(e.t==='begeni'){if(yikilis)return;const d=Math.min(Math.min(e.adet||1,30)*.1,Math.max(0,2.5-begSn));begSn+=d;SAL=Math.max(0,SAL-d);
  if(t-sonBp>220){sonBp=t;const bp=document.createElement('div');bp.className='bp';bp.textContent='👍';const r=barEl.getBoundingClientRect();bp.style.left=(r.left+r.width*Math.min(1,SAL/100)-8)+'px';bp.style.top=(r.top-4)+'px';document.body.appendChild(bp);setTimeout(()=>bp.remove(),1150)}}
 else if(e.t==='hediye'){const h=OY.hediye(e);OY.ses.para();hediye(u,h)}
}});
function korunuyor(){return now()<Math.max(koruBit,garsonBit)}
function hediye(u,h){let et='';const t=now();
 switch(h.sinif){
  case 'gul':{const n=Math.min(12,3*h.adet);bardakKoy(u,n);et=`+${n} bardak kuleye`;break}
  case 'kalp':SAL=Math.max(0,SAL-20*Math.min(3,h.adet));kelT=t;OY.ses.dogru();et='tepsi sabitledi · sallantı −20';break;
  case 'parfum':garsonBit=t+20000;bardakKoy(u,2);et='garson kuleyi 20 sn tutuyor';break;
  case 'donut':if(korunuyor()){et='rüzgâr! ama kule korumada 🛡';break}SAL+=18;yon=Math.random()<.5?-1:1;ruzBit=t+2500;OY.ses.gurultu(1.2,.25,700);et='💨 rüzgâr · sallantı +18';break;
  case 'sapka':{const k=KAT;if(k.bitti){bardakKoy(u,YUVA);et=`semaver! ${KATLAR.length+2}. katı alıyor`;break}const kalan=YUVA-k.bardak.length;BEK.unshift(...Array(kalan).fill(u));
   if(!k.semaver){const s=semaver();s.position.set(0,k.y+6,0);s.userData={hy:k.y,vy:0};TG.add(s);k.semaver=s}SAL=Math.max(0,SAL-10);et=`semaver! ${KATLAR.length+1}. kat senin`;break}
  case 'galaksi':{for(const k of KATLAR){if(k.sahip!==u)sahipDegis(k,u);k.tp.children.forEach(m=>m.material=altin)}koruBit=t+20000;SAL=Math.max(0,SAL-30);OY.ses.zafer();et=`ALTIN KULE: ${KATLAR.length} kat senin 👑`;break}
 }
 OY.vitrin(u,h.ikon,h.ad,et);OY.akis(`${h.ikon} ${u.ad} → ${et}`,'#ffd84a')}
if(DEMO)OY.demoYorum=()=>['Bir çay!','Demli olsun','Simit de var mı?','Kat benim!','Usta iki çay','Yıkılmasın!'][Math.random()*6|0];
// ---- DOM panel ----
const katNo=document.getElementById('katNo'),katS=document.getElementById('katS'),onde=document.getElementById('onde'),salY=document.getElementById('salY'),barEl=document.getElementById('bar'),barB=barEl.querySelector('b'),uyari=document.getElementById('uyari');
for(let i=0;i<YUVA;i++)katS.appendChild(document.createElement('i'));let ondeSon='';
function panel(){const k=KAT;katNo.textContent=`🏗 ${KATLAR.length+1}. KAT`;[...katS.children].forEach((d,i)=>{const b=k.bardak[i];d.style.background=b?urenk(b.userData.u).css:'transparent';d.style.borderColor=b?'#fff':''});
 const l=katLideri(k),os=l?l.id+':'+k.say[l.id]:'';if(os!==ondeSon){ondeSon=os;onde.innerHTML=l?`önde <img src="${OY.foto(l,48).toDataURL()}"><span>${OY.kisaAd(l.ad,10)}</span> ×${k.say[l.id]}`:'<span style="opacity:.75">yorum yaz → bardak koy</span>'}
 const p=Math.min(100,SAL),kr=korunuyor();salY.textContent=kr?`🛡 KORUMA ${Math.ceil((Math.max(koruBit,garsonBit)-now())/1000)} sn`:`〰 SALLANTI %${Math.round(p)}`;salY.style.color=kr?'#ffd166':'';
 barB.style.width=p+'%';barB.style.background=p<45?'#5fd38a':p<75?'#ffc94a':'#ff5b4a';const uy=p>=72&&!kr&&!yikilis;uyari.classList.toggle('ac',uy);uyari.style.opacity=uy?'':'0'}
// ---- ana dongu ----
let son=now(),bTik=0,pTik=0,fN=0,fT=now(),kamY=4,kamX=0;const ust=new THREE.Vector3();
function kare(){requestAnimationFrame(kare);const t=now(),dt=Math.min(.05,(t-son)/1000);son=t;fN++;if(t-fT>2000){window.__fps=Math.round(fN*1000/(t-fT));fN=0;fT=t}
 begSn=Math.max(0,begSn-dt*2.5);
 if(t-bTik>260){bTik=t;bardakIsle()}
 const n=KATLAR.length;
 if(!yikilis&&!bitis){if(t<garsonBit)SAL=Math.max(0,SAL-dt*2);else SAL+=dt*n*.05;if(korunuyor())SAL=Math.min(SAL,95);if(SAL>=100)yik()}
